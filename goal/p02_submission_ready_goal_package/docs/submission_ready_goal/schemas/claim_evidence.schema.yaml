version: claim_evidence_schema_v1
required_fields:
  - claim_id
  - claim
  - section
  - status
  - evidence
allowed_status:
  - supported
  - unsupported
  - unclear
  - planned
evidence_required_fields:
  - evidence_id
  - type
  - source_path
  - provenance
provenance_required_for_formal_result:
  - data_manifest
  - vibench_read_bundle
  - phmga_submodule_commit
  - phmga_experiment_id
  - artifact_dir
  - result_md
  - ledger_row
  - main_table
hard_fail:
  - supported_claim_without_evidence_id
  - table_without_ledger_row
  - figure_without_source_path
  - pending_result_used_as_supported_claim
