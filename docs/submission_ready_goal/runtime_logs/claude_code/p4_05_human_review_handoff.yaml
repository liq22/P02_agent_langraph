  supported:
    - claim: Coverage report represents all six P4_02 mapped comments and issues
      evidence: >-
        P4_02 question_mapping_matrix.yaml has 6 mappings (map-p4-001 through
        map-p4-006) covering comment_ids p4-01-c001 through p4-01-c006.
        P4_05 coverage_check_report.yaml has 6 coverage rows (cov-p4-001
        through cov-p4-006) with matching mapping_id, comment_id, issue_id,
        source_action_id, and source_comment_ids for every row. No mapped
        comment is missing; no extraneous comment is fabricated.
    - claim: Every coverage row contains all required fields
      evidence: >-
        Each of the 6 rows in coverage_check_report.yaml contains
        response_item_id, claim_id, evidence_id, manuscript_location,
        actionable_fix, severity, coverage_status, commitment_closure_status,
        source_comment_ids, and blocks_submission_until_revision_evidence.
        Cross-referenced against P4_02 and P4_03 upstream sources; all IDs
        match correctly.
    - claim: coverage_status covered means response-level coverage only
      evidence: >-
        manuscript.md explicitly states coverage check is not revision evidence
        closure. coverage_check.yaml summary records
        revision_evidence_still_required: true and
        final_submission_ready_claim: false. revision_evidence_map.yaml has
        p4_06_expected_status: pending for all 6 rows. All commitment_closure
        statuses are blocked or planned, none closed.
    - claim: Blocked and planned commitments are explicit and routed to P4_06
      evidence: >-
        3 blocked (rsp-p4-001 to rsp-p4-003: formal evidence, reproducibility,
        global validator) and 3 planned (rsp-p4-004 to rsp-p4-006: wording,
        figure/caption, style). revision_evidence_map.yaml targets P4_06
        explicitly with required_p4_06_action for each row. evidence_kind
        correctly classifies each commitment type.
    - claim: Official-comment absence and no-final-readiness boundaries are explicit
      evidence: >-
        official_journal_comments_available: false in coverage_check_report,
        question_mapping_matrix, and revision_evidence_map.
        final_submission_ready_claim: false in all artifacts.
        official_comments_missing: true in coverage_check.yaml summary.
        Manuscript explicitly names both absences in input boundaries section.
    - claim: Local mapping projection and revision-evidence handoff support P4_06 without fabrication
      evidence: >-
        question_mapping_matrix.yaml is a clean 6-row projection with all rows
        status: mapped and coverage_projection_complete: true.
        revision_evidence_map.yaml preserves all 6 rows with
        p4_06_expected_status: pending and specific required_p4_06_action
        entries. No row claims completed revision evidence.
