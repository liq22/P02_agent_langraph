        blocks_submission=false. Expected evidence requires claim/evidence status
        unchanged. No style or wording action is mixed into evidence-blocking
        clusters.
    - claim: Package avoids manuscript rewrites and final submission readiness claims
      evidence: >-
        manuscript.md explicitly states P3_04 does not apply manuscript edits.
        revision_action_map submission_ready_claim=false.
        critique_digest submission_ready_claim=false.
        session_manifest confirms no P2 edits or P1/P4 evidence repairs.
