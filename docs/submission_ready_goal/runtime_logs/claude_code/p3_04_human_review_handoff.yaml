        no comment ID, claim ID, or evidence ID was dropped or altered.
    - claim: Non-blocking and cosmetic actions separated from blocking actions with no-upgrade guards
      evidence: >-
        action-p3-004 action_type=manuscript_wording_revision_no_claim_upgrade,
        action-p3-005=figure_caption_boundary_check,
