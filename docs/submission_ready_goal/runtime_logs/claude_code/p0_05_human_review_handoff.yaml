      file: artifacts/constraint_risk_map.yaml P0_05_B001
    - gap: Provider/model policy verification status is partially_verified_with_rate_limit_blockers_retained but original verification logs were not inspected in this review
      severity: non_blocking
      file: artifacts/constraint_risk_map.yaml P0_05_B003
