findings:
  supported:
    - claim: Calibration artifact identifies concrete template-like sentences with specific replacements
      evidence: >-
        academic_expression_claim_calibration.md records nine patch entries
        (P2_05_R001-R009) with target TeX locations, original sentences, risk
        levels, and bounded replacements. High-risk entries target "research
        operating system" (R001), "the auditable connection" (R002), "turns
        manuscript production into" (R004), and "negative as much as positive"
        (R008). Cross-verified each original sentence against P2_03 TeX source
        files — all quotes match verbatim.
    - claim: Replacements make prose more specific without strengthening scientific claims
      evidence: >-
        R002 downgrades "the contribution is" to "The draft's process claim is"
        — narrowing scope. R004 replaces "turns manuscript production into" with
        "makes a narrower process contribution" — explicitly self-limiting. R006
        expands "the AutoResearch contract" to name actual package components.
        Non-upgrade ledger explicitly lists seven forbidden upgrade categories.
        Cross-verified against P2_02_05 claim_map forbidden_wording — no
        replacement violates any forbidden wording entry.
    - claim: Negative unsupported uncertain rejected and blocked evidence kept visible
      evidence: >-
        R008 replacement makes negative evidence retention more explicit:
        "unsupported rows are not rewritten as support." Manuscript Claim And
        Evidence Boundary section lists all retained global blockers. Claim
        P2_05_C04_NEGATIVE_EVIDENCE_RETAINED records preservation with upstream
        evidence refs. Non-upgrade ledger explicitly states no negative evidence
        removed. Cross-verified against P2_04 formal_check_report hard blocks —
        all remain preserved.
    - claim: Claim-evidence registry is schema-shaped with all required fields
      evidence: >-
        claim_evidence_registry.yaml contains five claims with explicit
        claim_id, claim_type (method/limitation), support_status (supported),
        manuscript_location, action (keep/document_limitation), and nested
        evidence_refs with evidence_id, evidence_type, and source_ref. Registry
        scope is appropriately node-local.
    - claim: Package does not claim final submission readiness
      evidence: >-
        Claim P2_05_C05_FINAL_SUBMISSION_STILL_BLOCKED explicitly records that
        P2_05 does not establish submission readiness. Manuscript Author Exit
        section states node close depends on independent review and response
        coverage. All global blockers preserved without softening.
