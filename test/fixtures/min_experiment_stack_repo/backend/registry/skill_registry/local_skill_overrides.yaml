nodes:
  research/P0_parent:
    purpose: Fixture parent scope.
    node_mode: parent
    default_delegate:
      local_action_only: true
  research/P0_parent/P0_01_done:
    purpose: Fixture completed leaf.
    node_mode: lite
    default_delegate:
      canonical_global_skill: leaf_node_writer
  research/P1_实验设计与仓库蓝图/P1_04_核心想法轻量验证:
    purpose: 在本节点内推进一轮有界轻量验证；若 contract 未就绪则先补齐 handoff。
    node_mode: execution
    node_profile: experiment_execution
    default_delegate:
      local_wrapper_skill: local_wrapper
    decision_rule:
      - when: artifacts/execution_contract.yaml 缺失
        then:
          canonical_global_skill: experiment_design_or_execution
      - when: contract_mode != executable 或 contract 不完整
        then:
          canonical_global_skill: experiment_design_or_execution
      - when: contract_mode == executable 且 contract 完整
        then: keep_default_delegate
    required_local_reads:
      - artifacts/execution_contract.yaml
    optional_local_reads:
      - docs/manuscript.md
    outputs:
      - artifacts/auto_experiment/results.tsv
      - logs/auto_experiment/latest_run.log
    extra_status_updates:
      - lifecycle.stage
      - progress_pct
    stop_with:
      - 缺关键输入或关键证据
      - execution contract 缺失、字段不完整或 mode 仍为 `review_only` 时，只允许转交 contract-prep
      - 本节点范围不清或越出节点职责
  research/P1_实验设计与仓库蓝图/P1_05_初步验证结果整理:
    purpose: 收敛轻量验证结果，形成支持/不支持/待澄清的结论边界。
    node_mode: execution
    node_profile: result_synthesis
    default_delegate:
      local_execution_skill: local_execution
    required_local_reads:
      - artifacts/auto_experiment/results.tsv
    optional_local_reads:
      - docs/manuscript.md
    outputs:
      - artifacts/result_registry.yaml
      - artifacts/hypothesis_status.yaml
    extra_status_updates:
      - lifecycle.stage
      - progress_pct
  research/P2_论文撰写/P2_02_初稿_md:
    purpose: Fixture manuscript scope.
    node_mode: lite
    default_delegate:
      canonical_global_skill: manuscript_worker
wrappers:
  research/P1_实验设计与仓库蓝图/P1_04_核心想法轻量验证:
    purpose: 为 auto_experiment_worker 绑定本地 contract、ledger 与日志路径。
    canonical_target: auto_experiment_worker
    node_profile: experiment_execution
    io_contract:
      inputs:
        - artifacts/execution_contract.yaml
      outputs:
        - artifacts/auto_experiment/results.tsv
        - logs/auto_experiment/latest_run.log
    required_local_reads:
      - artifacts/execution_contract.yaml
    optional_local_reads:
      - docs/manuscript.md
    extra_status_updates:
      - lifecycle.stage
      - progress_pct
executions:
  research/P1_实验设计与仓库蓝图/P1_05_初步验证结果整理:
    purpose: 收敛轻量验证结果，形成支持/不支持/待澄清的结论边界。
    node_profile: result_synthesis
    required_inputs:
      - artifacts/auto_experiment/results.tsv
    required_local_reads:
      - artifacts/auto_experiment/results.tsv
    optional_local_reads:
      - docs/manuscript.md
    outputs:
      - artifacts/result_registry.yaml
      - artifacts/hypothesis_status.yaml
    extra_status_updates:
      - lifecycle.stage
      - progress_pct
    stop_conditions:
      - missing_results_tsv
      - evidence_still_incoherent
