node_id: research::P4_论文回复_response::P4_04_正式回复_tex_或_doc
node_path: research/P4_论文回复_response/P4_04_正式回复_tex_或_doc
phase: P4
node_kind: leaf
prompt_assets:
- path: prompts/research_prompt.md
  status: required
- path: prompts/acceptance_checklist.yaml
  status: required
- path: prompts/revision_prompt.md
  status: recommended
- path: prompts/review_rubric.yaml
  status: required
required_questions_answered:
- item: 正式格式要求是什么？
  status: done
- item: 匿名化、编号、导出格式是否符合要求？
  status: done
required_outputs:
- path: 正式回复文档
  status: done
  description: 需由本节点形成或更新
- path: artifacts/claim_evidence_registry.yaml
  status: done
  description: profile-required local artifact
- path: artifacts/failure_register.yaml
  status: done
  description: profile-required local artifact
- path: artifacts/negative_result_note.md
  status: done
  description: profile-required local artifact
- path: artifacts/keep_discard_ledger.yaml
  status: done
  description: profile-required local artifact
quality_checks:
- item: 围绕 point-by-point response、clear description of changes、coverage 和 evidence
    链组织内容
  status: done
- item: 回复语气冷静专业，能指出具体修改位置
  status: done
- item: point-by-point、clear description of changes、格式一致
  status: done
- item: 节点产物必须能通过独立 reviewer agent 基于 `prompts/review_rubric.yaml` 的外部评审。
  status: done
handoff_ready_if:
- item: 形成可提交的正式 response 文档
  status: done
  note: node-local formal TeX response draft exists; final journal submission remains blocked by explicit non-node gates.
- item: 格式/匿名化/结构合规
  status: done
  note: TeX format, anonymity state, numbering, and export boundary are explicit; official metadata still pending.
- item: 独立 reviewer agent 已生成 `review/verdict.yaml`
  status: done
- item: '`review/verdict.yaml` 中 `review_complete == true`'
  status: done
- item: '`review/verdict.yaml` 中 `overall_verdict == pass`'
  status: done
- item: '`review/verdict.yaml` 中 `hard_fail == false`'
  status: done
- item: '`review/verdict.yaml` 中 `independence_confirmed == true`'
  status: done
stop_if:
- item: 缺关键输入或关键证据
  status: pending
- item: 本节点范围不清或越出节点职责
  status: pending
- item: 必须依赖的上游节点尚未就绪
  status: pending
- item: 缺少独立 reviewer verdict (`review/verdict.yaml`)
  status: pending
- item: 独立 reviewer verdict 尚未完成 (`review_complete != true`)
  status: pending
- item: 独立 reviewer 判定为 `revise` 或 `block`
  status: pending
- item: 独立 reviewer 提出 hard fail 且未关闭
  status: pending
- item: 核心 claim 没有 claim_id/evidence_id，或 evidence registry 与正文不一致。
  status: pending
- item: 负结果、失败实验、反例或限制被删除、隐藏或改写成正结果。
  status: pending
review_notes:
- slot: 1
  note: External AI review passed with score 86, hard_fail false, downstream_ready true; exact source_comment_ids were added to TeX after the non-blocking traceability observation.
- slot: 2
  note: User-authorized Claude Code teammate delegate passed the human-review slot; validated handoff is docs/submission_ready_goal/runtime_logs/claude_code/p4_04_human_review_handoff.yaml.
external_review_gate:
  required: true
  reviewer_role: external_node_reviewer
  reviewer_agent_must_be_distinct: true
  rubric_path: prompts/review_rubric.yaml
  verdict_path: review/verdict.yaml
  pass_condition:
    review_complete: true
    overall_verdict: pass
    hard_fail: false
    independence_confirmed: true
  required_reviewer_inputs:
  - README.md
  - status.yaml
  - prompts/research_prompt.md
  - prompts/acceptance_checklist.yaml
  - prompts/review_rubric.yaml
  - 正式回复文档
  - artifacts/claim_evidence_registry.yaml
  - artifacts/failure_register.yaml
  - artifacts/negative_result_note.md
  - artifacts/keep_discard_ledger.yaml
author_exit:
- item: 'claim_evidence_ids_are_explicit_or_gap_is_reported: true'
  status: done
- item: 'negative_or_failed_results_recorded: true'
  status: done
- item: 'protected_paths_respected: true'
  status: done
node_close:
- item: 'review/verdict.yaml:review_complete: true'
  status: done
- item: 'review/verdict.yaml:overall_verdict: pass'
  status: done
- item: 'review/verdict.yaml:hard_fail: false'
  status: done
- item: 'review/verdict.yaml:independence_confirmed: true'
  status: done
