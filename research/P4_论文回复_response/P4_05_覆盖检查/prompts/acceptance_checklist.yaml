node_id: research::P4_论文回复_response::P4_05_覆盖检查
node_path: research/P4_论文回复_response/P4_05_覆盖检查
phase: P4
node_kind: leaf
prompt_assets:
- path: prompts/research_prompt.md
  status: required
- path: prompts/acceptance_checklist.yaml
  status: required
- path: prompts/revision_prompt.md
  status: recommended
- path: prompts/review_rubric.yaml
  status: required
required_questions_answered:
- item: 有没有 comment 被漏答？
  status: done
- item: 有没有承诺修改但正文没改？
  status: done
- item: 有没有证据链断裂？
  status: done
required_outputs:
- path: artifacts/coverage_check_report.yaml
  status: done
  description: 需由本节点形成或更新
- path: artifacts/question_mapping_matrix.yaml
  status: done
  description: profile-required local artifact
- path: artifacts/revision_evidence_map.yaml
  status: done
  description: profile-required local artifact
quality_checks:
- item: 围绕 point-by-point response、clear description of changes、coverage 和 evidence
    链组织内容
  status: done
- item: 回复语气冷静专业，能指出具体修改位置
  status: done
- item: coverage 不只看回复文本，还看正文/图表/证据一致性
  status: done
- item: 节点产物必须能通过独立 reviewer agent 基于 `prompts/review_rubric.yaml` 的外部评审。
  status: done
- item: hard-gate block 必须绑定 claim_id/evidence_id/location/actionable_fix；否则只能作为 advisory
    critique。
  status: done
handoff_ready_if:
- item: 形成覆盖检查报告
  status: done
- item: 漏项/弱项被显式标出
  status: done
- item: 独立 reviewer agent 已生成 `review/verdict.yaml`
  status: done
- item: '`review/verdict.yaml` 中 `review_complete == true`'
  status: done
- item: '`review/verdict.yaml` 中 `overall_verdict == pass`'
  status: done
- item: '`review/verdict.yaml` 中 `hard_fail == false`'
  status: done
- item: '`review/verdict.yaml` 中 `independence_confirmed == true`'
  status: done
stop_if:
- item: 缺关键输入或关键证据
  status: pending
- item: 本节点范围不清或越出节点职责
  status: pending
- item: 必须依赖的上游节点尚未就绪
  status: pending
- item: 缺少独立 reviewer verdict (`review/verdict.yaml`)
  status: pending
- item: 独立 reviewer verdict 尚未完成 (`review_complete != true`)
  status: pending
- item: 独立 reviewer 判定为 `revise` 或 `block`
  status: pending
- item: 独立 reviewer 提出 hard fail 且未关闭
  status: pending
- item: hard gate 缺 citation/figure/venue/coverage/revision evidence 中的适用工件。
  status: pending
- item: blocking issue 没有 claim_id/evidence_id/location/actionable_fix。
  status: pending
review_notes:
- slot: 1
  note: External AI review passed P4_05 with score 88, hard_fail false, downstream_ready true; it confirmed six-row response-level coverage and P4_06 handoff readiness.
- slot: 2
  note: User-authorized Claude Code teammate delegate passed the human-review slot; validated handoff is docs/submission_ready_goal/runtime_logs/claude_code/p4_05_human_review_handoff.yaml.
external_review_gate:
  required: true
  reviewer_role: external_node_reviewer
  reviewer_agent_must_be_distinct: true
  rubric_path: prompts/review_rubric.yaml
  verdict_path: review/verdict.yaml
  pass_condition:
    review_complete: true
    overall_verdict: pass
    hard_fail: false
    independence_confirmed: true
  required_reviewer_inputs:
  - README.md
  - status.yaml
  - prompts/research_prompt.md
  - prompts/acceptance_checklist.yaml
  - prompts/review_rubric.yaml
  - ../P4_02_问题映射矩阵/artifacts/question_mapping_matrix.yaml
  - ../P4_03_逐点回复草稿_md/docs/manuscript.md
  - artifacts/coverage_check_report.yaml
  - artifacts/question_mapping_matrix.yaml
  - artifacts/revision_evidence_map.yaml
author_exit:
- item: 'gate_inputs_verified: true'
  status: done
- item: 'blocking_gaps_are_explicit: true'
  status: done
node_close:
- item: 'review/verdict.yaml:review_complete: true'
  status: done
- item: 'review/verdict.yaml:overall_verdict: pass'
  status: done
- item: 'review/verdict.yaml:hard_fail: false'
  status: done
- item: 'review/verdict.yaml:independence_confirmed: true'
  status: done
