node_id: research::P4_论文回复_response::P4_03_逐点回复草稿_md
node_path: research/P4_论文回复_response/P4_03_逐点回复草稿_md
phase: P4
node_kind: leaf
prompt_assets:
- path: prompts/research_prompt.md
  status: required
- path: prompts/acceptance_checklist.yaml
  status: required
- path: prompts/revision_prompt.md
  status: recommended
- path: prompts/review_rubric.yaml
  status: required
required_questions_answered:
- item: 回复是否逐点、编号、可追踪？
  status: done
- item: 是否在必要时礼貌反驳并给出根据？
  status: done
required_outputs:
- path: 逐点回复草稿
  status: done
  description: 需由本节点形成或更新
- path: docs/manuscript.md
  status: done
  description: profile-required local artifact
quality_checks:
- item: 围绕 point-by-point response、clear description of changes、coverage 和 evidence
    链组织内容
  status: done
- item: 回复语气冷静专业，能指出具体修改位置
  status: done
- item: 回复 calm、具体、逐点，清楚标出 change location
  status: done
- item: 节点产物必须能通过独立 reviewer agent 基于 `prompts/review_rubric.yaml` 的外部评审。
  status: done
handoff_ready_if:
- item: 每条主要 comment 都有对应回复
  status: done
- item: 语气专业，理由和修改位置清楚
  status: done
- item: 独立 reviewer agent 已生成 `review/verdict.yaml`
  status: done
- item: '`review/verdict.yaml` 中 `review_complete == true`'
  status: done
- item: '`review/verdict.yaml` 中 `overall_verdict == pass`'
  status: done
- item: '`review/verdict.yaml` 中 `hard_fail == false`'
  status: done
- item: '`review/verdict.yaml` 中 `independence_confirmed == true`'
  status: done
stop_if:
- item: 缺关键输入或关键证据
  status: pending
- item: 本节点范围不清或越出节点职责
  status: pending
- item: 必须依赖的上游节点尚未就绪
  status: pending
- item: 缺少独立 reviewer verdict (`review/verdict.yaml`)
  status: pending
- item: 独立 reviewer verdict 尚未完成 (`review_complete != true`)
  status: pending
- item: 独立 reviewer 判定为 `revise` 或 `block`
  status: pending
- item: 独立 reviewer 提出 hard fail 且未关闭
  status: pending
- item: 缺少本节点关键研究判断，或把未验证引用/证据写成确定事实。
  status: pending
- item: 作者退出条件与节点关闭条件混用，导致未评审内容伪装完成。
  status: pending
review_notes:
- slot: 1
  note: External AI review passed P4_03 with score 88, hard_fail false, downstream_ready true; it confirmed one response item per P4_02 mapping and no over-claiming.
- slot: 2
  note: User-authorized Claude Code teammate delegate passed the human-review slot; validated handoff is docs/submission_ready_goal/runtime_logs/claude_code/p4_03_human_review_handoff.yaml.
external_review_gate:
  required: true
  reviewer_role: external_node_reviewer
  reviewer_agent_must_be_distinct: true
  rubric_path: prompts/review_rubric.yaml
  verdict_path: review/verdict.yaml
  pass_condition:
    review_complete: true
    overall_verdict: pass
    hard_fail: false
    independence_confirmed: true
  required_reviewer_inputs:
  - README.md
  - status.yaml
  - prompts/research_prompt.md
  - prompts/acceptance_checklist.yaml
  - prompts/review_rubric.yaml
  - ../../P2_论文撰写/P2_03_定稿_tex/tex/main.tex
  - ../P4_02_问题映射矩阵/artifacts/question_mapping_matrix.yaml
  - 逐点回复草稿
  - docs/manuscript.md
author_exit:
- item: 'required_artifacts_exist: true'
  status: done
- item: 'key_research_judgment_answered_or_gap_reported: true'
  status: done
- item: 'citation_status_checked_when_external_sources_are_used: true'
  status: done
node_close:
- item: 'review/verdict.yaml:review_complete: true'
  status: done
- item: 'review/verdict.yaml:overall_verdict: pass'
  status: done
- item: 'review/verdict.yaml:hard_fail: false'
  status: done
- item: 'review/verdict.yaml:independence_confirmed: true'
  status: done
