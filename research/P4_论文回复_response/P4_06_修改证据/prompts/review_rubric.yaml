rubric_version: nature_node_review_v1
node_id: research::P4_论文回复_response::P4_06_修改证据
node_path: research/P4_论文回复_response/P4_06_修改证据
phase: P4
node_kind: leaf
node_mode: standard
node_profile: evidence_leaf
execution_profile: <none>
reviewer_role: external_node_reviewer
independence_requirement:
  reviewer_agent_must_be_distinct: true
  same_author_agent_forbidden: true
  required_artifact: review/verdict.yaml
scoring_dimensions:
- name: originality_novelty
  weight: 20
  reviewer_standard: Clear advance over strong prior work, not incremental repackaging.
- name: scientific_importance
  weight: 20
  reviewer_standard: Addresses a field-level scientific or engineering bottleneck.
- name: evidence_technical_soundness
  weight: 25
  reviewer_standard: Claims are supported by robust data, baselines, uncertainty,
    and controls.
- name: reproducibility_transparency
  weight: 15
  reviewer_standard: Data, code, protocol, config, and limitations are inspectable.
- name: broad_interest_story_clarity
  weight: 10
  reviewer_standard: A scientist outside the narrow subfield can understand why it
    matters.
- name: review_robustness
  weight: 10
  reviewer_standard: Anticipates alternative explanations, negative results, and reviewer
    attacks.
verdict_thresholds:
  nature_ready_candidate_min_score: 90
  strong_specialist_min_score: 80
  revise_min_score: 60
  block_below_score: 60
  downstream_pass_min_score: 80
hard_fail_conditions:
- Unsupported central claim.
- Material citation is missing, unverified, or mismatched with the claim it supports.
- Figure lacks provenance, claim mapping, or evidence mapping.
- Missing reproducibility path for data, code, protocol, or configuration.
- Hidden negative result or omitted limitation.
- Graph, Canvas, or dashboard treated as research truth.
- Unbounded autonomous loop or undeclared handoff.
- Reviewer-critical concern not mapped to evidence or revision action.
phase_review_lenses:
- 重点检查逐点回复是否直接、可核对、能定位正文改动和证据位置。
- 重点检查 coverage 是否完整，是否存在 evasive response 或无证据承诺。
- comment coverage、evidence traceability、change location 和 package integrity 都可核对。
- 未关闭 review block 不得进入 resubmission ready。
- 所有 citation/figure/evidence 改动都能追到本地 artifact。
node_level_5_criterion: Each change has diff, experiment, figure, table, or text evidence.
node_blocking_failure: Says changed without proof.
required_reviewer_inputs:
- README.md
- status.yaml
- prompts/research_prompt.md
- prompts/acceptance_checklist.yaml
- prompts/review_rubric.yaml
- ../P4_02_问题映射矩阵/artifacts/question_mapping_matrix.yaml
- ../P4_03_逐点回复草稿_md/docs/manuscript.md
- ../../P2_论文撰写/P2_03_定稿_tex/tex/main.tex
- revision evidence map
- artifacts/claim_evidence_registry.yaml
- artifacts/failure_register.yaml
- artifacts/negative_result_note.md
- artifacts/keep_discard_ledger.yaml
required_review_outputs:
- review/AI_001.md
- review/verdict.yaml
- review/response.yaml
