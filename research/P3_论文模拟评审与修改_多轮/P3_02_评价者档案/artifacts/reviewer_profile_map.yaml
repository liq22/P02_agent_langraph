    hard_fail_conditions:
      - synthetic_single_run_signal_promoted_to_formal_result
      - RM101_or_real_data_gap_hidden
      - low_review_score_threshold_ignored

  - profile_id: venue_claim_clarity_reviewer
    profile_type: reviewer_bundle
    lens_refs:
      - eic
      - domain_expert
      - cross_disciplinary_reader
    priority: medium_high
