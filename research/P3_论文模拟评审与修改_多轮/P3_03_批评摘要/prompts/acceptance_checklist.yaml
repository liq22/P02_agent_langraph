node_id: research::P3_论文模拟评审与修改_多轮::P3_03_批评摘要
node_path: research/P3_论文模拟评审与修改_多轮/P3_03_批评摘要
phase: P3
node_kind: leaf
prompt_assets:
- path: prompts/research_prompt.md
  status: required
- path: prompts/acceptance_checklist.yaml
  status: required
- path: prompts/revision_prompt.md
  status: recommended
- path: prompts/review_rubric.yaml
  status: required
required_questions_answered:
- item: 哪些批评是同一根因的不同表述？
  status: pending
- item: 哪些问题最先修？
  status: pending
- item: review_issue_register 是否保留 source_comment_ids、severity、affected claim、evidence
    gap、location 与 next action？
  status: pending
required_outputs:
- path: critique digest
  status: pending
  description: 需由本节点形成或更新
- path: 问题聚类结果
  status: pending
  description: 需由本节点形成或更新
- path: artifacts/claim_evidence_registry.yaml
  description: profile-required local artifact
- path: artifacts/failure_register.yaml
  description: profile-required local artifact
- path: artifacts/negative_result_note.md
  description: profile-required local artifact
- path: artifacts/keep_discard_ledger.yaml
  description: profile-required local artifact
- path: artifacts/critique_digest.yaml
  status: pending
  description: 压缩后的 critique digest
- path: artifacts/review_issue_register.yaml
  status: pending
  description: 原子化 review issue register
- path: logs/session_manifest.yaml
  status: pending
  description: 记录 critique 聚合与外部评审会话
quality_checks:
- item: 围绕 reviewer 视角、blocking issues、comment clustering、revision actionability 组织内容
  status: pending
- item: 批评要具体、可执行、可验证
  status: pending
- item: 聚类后仍保留原 comment 可追溯性
  status: pending
- item: review_issue_register 按 checklist dimension 聚合，同时保留少数强反对意见和矛盾反馈。
  status: pending
- item: 节点产物必须能通过独立 reviewer agent 基于 `prompts/review_rubric.yaml` 的外部评审。
  status: pending
handoff_ready_if:
- item: 至少形成 blocking / non-blocking / cosmetic 三类聚合
  status: pending
- item: 每个 blocking issue 都能路由到 P3_04 修订动作或显式 blocker
  status: pending
- item: 独立 reviewer agent 已生成 `review/verdict.yaml`
  status: pending
- item: '`review/verdict.yaml` 中 `review_complete == true`'
  status: pending
- item: '`review/verdict.yaml` 中 `overall_verdict == pass`'
  status: pending
- item: '`review/verdict.yaml` 中 `hard_fail == false`'
  status: pending
- item: '`review/verdict.yaml` 中 `independence_confirmed == true`'
  status: pending
stop_if:
- item: 缺关键输入或关键证据
  status: pending
- item: 本节点范围不清或越出节点职责
  status: pending
- item: 必须依赖的上游节点尚未就绪
  status: pending
- item: 缺少独立 reviewer verdict (`review/verdict.yaml`)
  status: pending
- item: 独立 reviewer verdict 尚未完成 (`review_complete != true`)
  status: pending
- item: 独立 reviewer 判定为 `revise` 或 `block`
  status: pending
- item: 独立 reviewer 提出 hard fail 且未关闭
  status: pending
- item: 核心 claim 没有 claim_id/evidence_id，或 evidence registry 与正文不一致。
  status: pending
- item: 负结果、失败实验、反例或限制被删除、隐藏或改写成正结果。
  status: pending
- item: 聚合会丢失 source_comment_ids、强反对意见或矛盾反馈。
  status: pending
review_notes:
- slot: 1
  note: <待填写>
- slot: 2
  note: <待填写>
external_review_gate:
  required: true
  reviewer_role: external_node_reviewer
  reviewer_agent_must_be_distinct: true
  rubric_path: prompts/review_rubric.yaml
  verdict_path: review/verdict.yaml
  pass_condition:
    review_complete: true
    overall_verdict: pass
    hard_fail: false
    independence_confirmed: true
  required_reviewer_inputs:
  - README.md
  - status.yaml
  - prompts/research_prompt.md
  - prompts/acceptance_checklist.yaml
  - prompts/review_rubric.yaml
  - ../prompts/standards.md
  - review/
  - critique digest
  - 问题聚类结果
  - artifacts/claim_evidence_registry.yaml
  - artifacts/failure_register.yaml
  - artifacts/negative_result_note.md
  - artifacts/keep_discard_ledger.yaml
  - artifacts/critique_digest.yaml
  - artifacts/review_issue_register.yaml
  - logs/session_manifest.yaml
author_exit:
- item: 'claim_evidence_ids_are_explicit_or_gap_is_reported: true'
  status: pending
- item: 'negative_or_failed_results_recorded: true'
  status: pending
- item: 'protected_paths_respected: true'
  status: pending
node_close:
- item: 'review/verdict.yaml:review_complete: true'
  status: pending
- item: 'review/verdict.yaml:overall_verdict: pass'
  status: pending
- item: 'review/verdict.yaml:hard_fail: false'
  status: pending
- item: 'review/verdict.yaml:independence_confirmed: true'
  status: pending
