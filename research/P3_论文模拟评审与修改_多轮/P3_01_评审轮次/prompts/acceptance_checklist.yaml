node_id: research::P3_论文模拟评审与修改_多轮::P3_01_评审轮次
node_path: research/P3_论文模拟评审与修改_多轮/P3_01_评审轮次
phase: P3
node_kind: leaf
prompt_assets:
- path: prompts/research_prompt.md
  status: required
- path: prompts/acceptance_checklist.yaml
  status: required
- path: prompts/revision_prompt.md
  status: recommended
- path: prompts/review_rubric.yaml
  status: required
required_questions_answered:
- item: 这一轮模拟谁？
  status: done
- item: 关注 novelty、methods、statistics、format 还是 reproducibility？
  status: done
- item: 本轮 reviewer lens、checklist dimension、manuscript snapshot 与停止条件是否明确？
  status: done
required_outputs:
- path: review_round_index
  status: done
  description: 需由本节点形成或更新
- path: 每轮目标定义
  status: done
  description: 需由本节点形成或更新
- path: docs/manuscript.md
  status: done
  description: profile-required local artifact
- path: artifacts/review_round_notes.md
  status: done
  description: node-local round notes with manuscript snapshot and next triggers
- path: artifacts/review_round_index.yaml
  status: done
  description: structured review round index and issue-output contract
quality_checks:
- item: 围绕 reviewer 视角、blocking issues、comment clustering、revision actionability 组织内容
  status: done
- item: 批评要具体、可执行、可验证
  status: done
- item: 每轮评审角色明确、关注点单一清楚
  status: done
- item: 每轮只检查声明的 reviewer lens 与 checklist dimension，不扩成整篇论文重写。
  status: done
- item: 节点产物必须能通过独立 reviewer agent 基于 `prompts/review_rubric.yaml` 的外部评审。
  status: done
handoff_ready_if:
- item: 至少定义 2 种不同评审视角
  status: done
- item: 每轮输出格式清晰
  status: done
- item: review_round_notes 记录 manuscript_snapshot 与下一轮 trigger
  status: done
- item: 独立 reviewer agent 已生成 `review/verdict.yaml`
  status: done
- item: '`review/verdict.yaml` 中 `review_complete == true`'
  status: done
- item: '`review/verdict.yaml` 中 `overall_verdict == pass`'
  status: done
- item: '`review/verdict.yaml` 中 `hard_fail == false`'
  status: done
- item: '`review/verdict.yaml` 中 `independence_confirmed == true`'
  status: done
stop_if:
- item: 缺关键输入或关键证据
  status: pending
- item: 本节点范围不清或越出节点职责
  status: pending
- item: 必须依赖的上游节点尚未就绪
  status: pending
- item: 缺少独立 reviewer verdict (`review/verdict.yaml`)
  status: pending
- item: 独立 reviewer verdict 尚未完成 (`review_complete != true`)
  status: pending
- item: 独立 reviewer 判定为 `revise` 或 `block`
  status: pending
- item: 独立 reviewer 提出 hard fail 且未关闭
  status: pending
- item: 缺少本节点关键研究判断，或把未验证引用/证据写成确定事实。
  status: pending
- item: 作者退出条件与节点关闭条件混用，导致未评审内容伪装完成。
  status: pending
- item: 本轮缺 manuscript snapshot、reviewer lens 或 checklist dimension。
  status: pending
review_notes:
- slot: 1
  note: external AI reviewer passed with score 84, hard_fail false, downstream_ready true; non-blocking bookkeeping and downstream-input issues were addressed or recorded in response.
- slot: 2
  note: user-authorized Claude Code teammate delegate passed the human-review slot with a valid v2 handoff.
external_review_gate:
  required: true
  reviewer_role: external_node_reviewer
  reviewer_agent_must_be_distinct: true
  rubric_path: prompts/review_rubric.yaml
  verdict_path: review/verdict.yaml
  pass_condition:
    review_complete: true
    overall_verdict: pass
    hard_fail: false
    independence_confirmed: true
  required_reviewer_inputs:
  - README.md
  - status.yaml
  - prompts/research_prompt.md
  - prompts/acceptance_checklist.yaml
  - prompts/review_rubric.yaml
  - ../prompts/standards.md
  - ../../P2_论文撰写/P2_03_定稿_tex/tex/main.tex
  - review_round_index
  - 每轮目标定义
  - docs/manuscript.md
author_exit:
- item: 'required_artifacts_exist: true'
  status: done
- item: 'key_research_judgment_answered_or_gap_reported: true'
  status: done
- item: 'citation_status_checked_when_external_sources_are_used: true'
  status: done
node_close:
- item: 'review/verdict.yaml:review_complete: true'
  status: done
- item: 'review/verdict.yaml:overall_verdict: pass'
  status: done
- item: 'review/verdict.yaml:hard_fail: false'
  status: done
- item: 'review/verdict.yaml:independence_confirmed: true'
  status: done
