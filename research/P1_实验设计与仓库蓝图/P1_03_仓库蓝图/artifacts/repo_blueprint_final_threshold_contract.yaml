blueprint_readiness:
  required_module_path_locked:
    modules:
      - data_read_boundary
      - protocol_builder
      - planner_bridge
      - dag_compiler
      - runner
      - metrics_parser
      - ledger_writer
    pass_rule: Seven required responsibilities cover the dataset-to-ledger path without adding UI, paper export, notebook, or global orchestration modules.
    evidence_sources:
      - docs/manuscript.md#2-必须模块
      - artifacts/repo_blueprint.yaml#required_directories
      - artifacts/module_map.yaml#modules
  config_and_operator_truth_locked:
    config_roots:
      - configs/datasets
      - configs/runs
      - configs/providers
      - configs/operators
      - configs/workflow_graphs
    pass_rule: Config files are declared inputs only; provider credentials are external, operator registries are planner/compiler inputs, and workflow graph configs cannot point to scheduler, Canvas, dashboard, or web projections.
    evidence_sources:
      - artifacts/repo_blueprint.yaml#run_config_contract
      - artifacts/module_map.yaml#operator_registry_contract
      - artifacts/module_map.yaml#workflow_graph_contract
  run_bundle_and_ledger_truth_locked:
