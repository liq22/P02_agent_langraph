      - artifacts/failure_register.yaml
      - artifacts/keep_discard_ledger.yaml

node_vs_global_readiness:
  p1_03_may_claim:
    - repository responsibilities are minimal and owner-bound
    - config, operator registry, workflow graph, run bundle, metric, and ledger truth roles are explicit
    - downstream implementation receives a reproducible path from read-only data to result ledger
    - graph, Canvas, dashboard, review, report, and notebook artifacts are excluded as duplicate metric/table truth
    - unresolved formal-evidence blockers are preserved as downstream blockers
  p1_03_must_not_claim:
    - PHMGA implementation has completed formal Stage C/D rows
    - selected_global_best_backend is locked
    - RM101 reject evidence has become positive selection evidence
    - adapter sample-level metadata-H5 preflight is complete
    - P1_03 checklist/status fields are closed by this score review
    - final validator passes

reviewer_acceptance_criteria:
  - P1_03 may pass the node-specific final score threshold if the blueprint
    makes ownership, directory, config, script, artifact, metric, ledger,
    failure, and defer boundaries precise enough for downstream implementation
    and review.
  - P1_03 should fail if it adds global orchestration, UI, dashboard, notebook,
    or paper-export modules as required result-path truth, or if it allows
    scheduler graphs, reports, review files, or partial/reject rows to become
    metric or table truth.
  - P1_03 should not be penalized for missing selected backend, adapter
    preflight, Stage C/D rows, RM101 positive evidence, or final validator pass
    when those are explicitly preserved as downstream blockers and not used as
    support.
  - P1_03 score re-review must not close canonical checklist fields; checklist
    closure remains a separate explicitly approved status operation.

global_submission_status:
  global_submission_ready: false
  remaining_global_blocker_classes:
    - P1_01-P1_05 checklist fields remain incomplete until explicit approval
    - P1/P3/P4 below-90 score nodes remain
    - P3_04 action statuses remain blocked or planned
    - selected backend and Stage C/D formal evidence remain pending
    - final validator does not pass

author_exit:
  minimal_module_path_locked: true
  config_operator_workflow_boundaries_locked: true
  run_bundle_and_ledger_truth_locked: true
  duplicate_truth_exclusions_locked: true
  downstream_evidence_not_overclaimed: true
  checklist_status_not_closed_by_this_contract: true
