    pass_rule: Formal rows are eligible only when the run bundle validates and the ledger writer records keep/reject with evidence refs; paper tables cannot cite narrative reports, graph projections, review files, or partial/reject rows as metric truth.
    evidence_sources:
      - artifacts/repo_blueprint.yaml#required_run_bundle
