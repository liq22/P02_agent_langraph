max_hours: 4
child_scan_order: []
enabled_skills: []
agent_read_exclude:
- docs/HUMAN_ONLY.md
review_requirement:
  ai: 1
  human: 0
human_interaction:
  mode: on_demand
  triggers:
  - missing_research_input
  - unresolved_scientific_tradeoff
  - legal_or_ethics_blocker
  - reviewer_block_not_closed
  - final_submission_approval
freeze_when:
- ai_review_count >= 1
- all_comments_responded == true
- all_children_ready == true
