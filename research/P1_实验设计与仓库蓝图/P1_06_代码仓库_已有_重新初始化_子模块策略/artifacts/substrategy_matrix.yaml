substrategies:
  - strategy_id: P1_06_S001_MAIN_REPO_TRUTH_BOUNDARY
    strategy_name: main_repo_orchestration_and_paper_truth
    owned_by: parent_repository
    includes:
      - scheduler truth sources and graph refresh scripts
      - node-local manuscript/artifact/review/response/status files
      - submission-ready validators and FSM/audit files
      - PHMGA/Vibench boundary and handoff specifications
