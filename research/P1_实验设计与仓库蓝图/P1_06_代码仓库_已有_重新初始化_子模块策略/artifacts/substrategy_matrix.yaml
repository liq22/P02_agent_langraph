      documented: true
      consistent: true
      complete: parent artifacts cite submodule paths instead of duplicating implementation
      exercisable: graph refresh and validators can run without importing PHMGA internals as parent truth
    rollback: Revert parent node artifacts or submodule pointer; do not manually copy PHMGA internals into parent repo.
  - strategy_id: P1_06_S002_PHMGA_SUBMODULE_BOUNDARY
    strategy_name: phmga_submodule_source_and_experiment_boundary
    owned_by: PHMGA_submodule
    includes:
      - PHMGA src, config, tests, scripts, docs, ledgers, and paper_phmga evidence bundles
      - provider/model implementation details inside PHMGA
      - Stage B/C/D experiment execution assets when later nodes authorize them
    excludes:
      - parent graph or Canvas state
      - parent review verdict authority
      - final submission-ready claim authority
    minimum_requirements:
      documented: true
      consistent: branch and commit match .gitmodules policy
      complete: dirty state is surfaced before pointer movement
      exercisable: future update path is fetch -> compare -> protect dirty work -> fast-forward or explicit blocker
    rollback: Restore prior submodule commit pointer after PHMGA dirty work is protected; never reset unreviewed dirty work by default.
  - strategy_id: P1_06_S003_EXTERNAL_DATA_AND_SECRET_BOUNDARY
    strategy_name: external_data_and_runtime_secret_boundary
    owned_by: local_runtime_environment
    includes:
      - /mnt/k/D01_vibench as external data root
      - .env runtime credentials outside committed artifacts
      - provider/model policy checks that avoid printing secret values
    excludes:
      - copied H5 datasets in the repository
      - committed API keys or credential fragments
      - Vibench trainer/evaluator output as PHMGA formal evidence
    minimum_requirements:
      documented: true
      consistent: data root and credential boundary match submission-ready policy
      complete: secret-fragment scans exclude .env but cover artifacts
      exercisable: PHMGA receives read bundles/protocol inputs rather than parent-copied data
    rollback: Remove invalid runtime references from artifacts and rerun boundary checks; do not rewrite .env into node files.
  - strategy_id: P1_06_S004_UPDATE_REVIEW_AND_ROLLBACK_POLICY
    strategy_name: update_review_and_rollback_policy
    owned_by: codex_lead_with_user_authorization
    includes:
      - submodule fetch and fast-forward-only update policy
      - dirty work protection before pointer movement
      - independent review gates for parent strategy closure
      - explicit blocker recording when pull/update cannot be done safely
    excludes:
      - destructive cleanup without user approval
      - manual path magic
      - unpinned dependency upgrades
      - graph progression as proof of code validity
    minimum_requirements:
      documented: true
      consistent: update policy preserves local PHMGA modifications
      complete: review/verdict and response records distinguish node pass from final submission readiness
      exercisable: a reviewer can reproduce git facts with status, rev-parse, rev-list, fetch, and pull --ff-only
    rollback: If update breaks evidence path, return parent pointer to previous commit and retain failed update as blocker evidence.

