    supports:
      - c1
      - P1_09_C04_FINAL_THRESHOLD_FIGURE_LOCK
    only_under_boundary: preliminary synthetic/offline single-run signal
    does_not_support:
      - formal Stage C/D result
      - selected_global_best_backend lock
      - real-data RM101 or PHMGA/Vibench readiness
