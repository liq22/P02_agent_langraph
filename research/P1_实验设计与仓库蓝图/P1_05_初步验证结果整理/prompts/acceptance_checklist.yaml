node_id: research::P1_实验设计与仓库蓝图::P1_05_初步验证结果整理
node_path: research/P1_实验设计与仓库蓝图/P1_05_初步验证结果整理
phase: P1
node_kind: leaf
prompt_assets:
- path: prompts/research_prompt.md
  status: required
- path: prompts/acceptance_checklist.yaml
  status: required
- path: prompts/review_rubric.yaml
  status: required
required_questions_answered:
- item: 哪些结果支持当前主张？
  status: pending
- item: 哪些结果必须标为 unsupported 或 unclear？
  status: pending
- item: 哪些结果可以安全进入正文、表格或图？
  status: pending
required_outputs:
- path: artifacts/result_registry.yaml
  status: pending
  description: 需由本节点形成或更新
- path: artifacts/hypothesis_status.yaml
  status: pending
  description: 需由本节点形成或更新
- path: artifacts/paper_ready_result_summary.md
  status: pending
  description: 需由本节点形成或更新
- path: artifacts/gate_report.md
  description: profile-required local artifact
quality_checks:
- item: 每条结论都能回指到 results ledger 中的具体证据位置
  status: pending
- item: 明确 supported / unsupported / unclear，不把缺证据项写成正结论
  status: pending
- item: 负结果、不确定性与证据缺口需要保留，不能静默吞掉
  status: pending
- item: 不提高 claim 强度
  status: pending
- item: 节点产物必须能通过独立 reviewer agent 基于 `prompts/review_rubric.yaml` 的外部评审。
  status: pending
- item: hard-gate block 必须绑定 claim_id/evidence_id/location/actionable_fix；否则只能作为 advisory
    critique。
  status: pending
handoff_ready_if:
- item: 至少区分 supported/unsupported/unclear
  status: pending
- item: result registry 与 hypothesis status 已能支撑后续 figure/table/claim
  status: pending
- item: 证据位置明确
  status: pending
- item: 独立 reviewer agent 已生成 `review/verdict.yaml`
  status: pending
- item: '`review/verdict.yaml` 中 `review_complete == true`'
  status: pending
- item: '`review/verdict.yaml` 中 `overall_verdict == pass`'
  status: pending
- item: '`review/verdict.yaml` 中 `hard_fail == false`'
  status: pending
- item: '`review/verdict.yaml` 中 `independence_confirmed == true`'
  status: pending
stop_if:
- item: 缺关键输入或关键证据
  status: pending
- item: 本节点范围不清或越出节点职责
  status: pending
- item: 必须依赖的上游节点尚未就绪
  status: pending
- item: 缺少独立 reviewer verdict (`review/verdict.yaml`)
  status: pending
- item: 独立 reviewer verdict 尚未完成 (`review_complete != true`)
  status: pending
- item: 独立 reviewer 判定为 `revise` 或 `block`
  status: pending
- item: 独立 reviewer 提出 hard fail 且未关闭
  status: pending
- item: hard gate 缺 citation/figure/venue/coverage/revision evidence 中的适用工件。
  status: pending
- item: blocking issue 没有 claim_id/evidence_id/location/actionable_fix。
  status: pending
review_notes:
- slot: 1
  note: <待填写>
- slot: 2
  note: <待填写>
external_review_gate:
  required: true
  reviewer_role: external_node_reviewer
  reviewer_agent_must_be_distinct: true
  rubric_path: prompts/review_rubric.yaml
  verdict_path: review/verdict.yaml
  pass_condition:
    review_complete: true
    overall_verdict: pass
    hard_fail: false
    independence_confirmed: true
  required_reviewer_inputs:
  - README.md
  - status.yaml
  - prompts/research_prompt.md
  - prompts/acceptance_checklist.yaml
  - prompts/review_rubric.yaml
  - research/P1_实验设计与仓库蓝图/P1_04_核心想法轻量验证/artifacts/auto_experiment/results.tsv
  - docs/manuscript.md
  - artifacts/result_registry.yaml
  - artifacts/hypothesis_status.yaml
  - artifacts/paper_ready_result_summary.md
  - artifacts/gate_report.md
author_exit:
- item: 'gate_inputs_verified: true'
  status: pending
- item: 'blocking_gaps_are_explicit: true'
  status: pending
node_close:
- item: 'review/verdict.yaml:review_complete: true'
  status: pending
- item: 'review/verdict.yaml:overall_verdict: pass'
  status: pending
- item: 'review/verdict.yaml:hard_fail: false'
  status: pending
- item: 'review/verdict.yaml:independence_confirmed: true'
  status: pending
