reviewer_acceptance_criteria:
  - P1_02 may pass the node-specific final score threshold if the pseudocode
    and interface contract make every formal result row traceable from input
    bundle to artifact index, metrics, result markdown, ledger row, and optional
    paper table row.
  - P1_02 should fail if final_report.md, planner text, graph progression,
    Vibench training outputs, or partial/reject Stage B evidence can become
    metric or table truth.
  - P1_02 should not be penalized for missing selected backend, adapter
    preflight, Stage C/D rows, or final validator pass when those are explicitly
    preserved as downstream blockers and not used as support.
  - P1_02 score re-review must not close canonical checklist fields; checklist
    closure remains a separate explicitly approved status operation.

