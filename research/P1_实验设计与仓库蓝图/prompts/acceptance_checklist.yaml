node_id: research::P1_实验设计与仓库蓝图
node_path: research/P1_实验设计与仓库蓝图
phase: P1
node_kind: parent
prompt_assets:
- path: prompts/research_prompt.md
  status: required
- path: prompts/acceptance_checklist.yaml
  status: required
- path: prompts/experiment_prompt.md
  status: recommended
- path: prompts/standards.md
  status: optional
- path: prompts/review_rubric.yaml
  status: required
required_questions_answered:
- item: 实验设计链条是否闭环？
  status: pending
- item: 哪些子节点是依赖前置，哪些是并行准备？
  status: pending
- item: 是否存在缺 baseline、缺指标、缺 artifact 的薄弱环节？
  status: pending
required_outputs:
- path: 实验设计总览摘要
  status: pending
  description: 需由本节点形成或更新
- path: 关键依赖/阻塞项列表
  status: pending
  description: 需由本节点形成或更新
quality_checks:
- item: 围绕 baseline、metric、protocol、reproducibility、artifact 完整性组织内容
  status: pending
- item: 明确 documented / consistent / complete / exercisable 的最低要求
  status: pending
- item: 强调可复现、可执行、artifact 自洽
  status: pending
- item: 只保留支撑主张所需的最小复杂度
  status: pending
- item: 节点产物必须能通过独立 reviewer agent 基于 `prompts/review_rubric.yaml` 的外部评审。
  status: pending
- item: 父节点只做 coordination/routing/summary，不替 leaf 子节点产出证据或正文。
  status: pending
handoff_ready_if:
- item: 明确实验设计主链
  status: pending
- item: 依赖顺序与阻塞项清晰
  status: pending
- item: 没有明显缺协议/缺 baseline 的空洞
  status: pending
- item: 独立 reviewer agent 已生成 `review/verdict.yaml`
  status: pending
- item: '`review/verdict.yaml` 中 `review_complete == true`'
  status: pending
- item: '`review/verdict.yaml` 中 `overall_verdict == pass`'
  status: pending
- item: '`review/verdict.yaml` 中 `hard_fail == false`'
  status: pending
- item: '`review/verdict.yaml` 中 `independence_confirmed == true`'
  status: pending
stop_if:
- item: 缺关键输入或关键证据
  status: pending
- item: 本节点范围不清或越出节点职责
  status: pending
- item: 必须依赖的上游节点尚未就绪
  status: pending
- item: 缺少独立 reviewer verdict (`review/verdict.yaml`)
  status: pending
- item: 独立 reviewer verdict 尚未完成 (`review_complete != true`)
  status: pending
- item: 独立 reviewer 判定为 `revise` 或 `block`
  status: pending
- item: 独立 reviewer 提出 hard fail 且未关闭
  status: pending
- item: 父节点替 leaf 节点产出正文、实验、图表或审稿结论。
  status: pending
- item: 存在 ready child 但父节点继续深写，导致 route_child_first 被忽略。
  status: pending
review_notes:
- slot: 1
  note: <待填写>
- slot: 2
  note: <待填写>
external_review_gate:
  required: true
  reviewer_role: external_node_reviewer
  reviewer_agent_must_be_distinct: true
  rubric_path: prompts/review_rubric.yaml
  verdict_path: review/verdict.yaml
  pass_condition:
    review_complete: true
    overall_verdict: pass
    hard_fail: false
    independence_confirmed: true
  required_reviewer_inputs:
  - README.md
  - status.yaml
  - prompts/research_prompt.md
  - prompts/acceptance_checklist.yaml
  - prompts/review_rubric.yaml
  - prompts/standards.md
  - 实验设计总览摘要
  - 关键依赖/阻塞项列表
author_exit:
- item: 'child_frontier_checked: true'
  status: pending
- item: 'route_child_first_or_frontier_gap_reported: true'
  status: pending
- item: 'no_leaf_content_authored_in_parent: true'
  status: pending
node_close:
- item: 'all_required_children_closed_or_blocked_with_reason: true'
  status: pending
- item: 'parent_rollup_consistent_with_child_artifacts: true'
  status: pending
