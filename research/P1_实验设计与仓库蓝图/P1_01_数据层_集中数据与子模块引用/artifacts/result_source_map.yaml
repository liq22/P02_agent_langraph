    rejection_reason: max_iterations reached before finish with need_patch
trace_required_for_each_result:
  - experiment_id
  - preset_name
  - dataset
  - graph_path
  - artifact_dir
  - result_md
  - ledger_row
  - main_table_row
  - phmga_commit
  - data_manifest
  - vibench_read_bundle
