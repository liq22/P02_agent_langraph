v2_rigor_plan:
  rigor_policy: >-
    Metrics must be preregistered before execution or review scoring. Favorable
    single metrics cannot be cherry-picked into claims; unsupported, unclear,
    failed, rate-limited, and reject evidence remain visible.
  documented:
    objectives:
      - H1_CLAIM_VALIDITY
      - H2_REVIEW_RESPONSE_CLOSURE
      - H3_FORMAL_EVIDENCE_ELIGIBILITY
    protocols:
      - P1_07_PROTO_001_FIXED_NODE_GOVERNANCE_COMPARISON
      - P1_07_PROTO_002_FORMAL_EVIDENCE_ELIGIBILITY_GATE
    primary_outcomes:
      - claim_evidence_validity_rate
      - formal_result_eligibility_pass
    secondary_outcomes:
      - unsupported_claim_count
      - independent_reviewer_pass_rate
      - response_coverage_rate
      - hard_fail_closure_rate
      - negative_result_retention_rate
      - protocol_completeness_rate
      - reproducibility_rerun_agreement
      - boundary_violation_count
      - final_validator_blocker_count
      - stage_c_main_result_pass
      - stage_d_ablation_pass
    baselines:
      - manual_checklist_workflow
      - prompt_only_agent_workflow
      - agent_without_independent_gate
    formal_controls:
      - provider_model_policy_free_boundary
      - vibench_read_only_boundary
      - phmga_protocol_and_result_ownership
      - selected_backend_lock
      - artifact_contract
      - stage_c_main_rows
      - stage_d_ablation_rows
  consistent:
    claim_identity_rule: Every central claim must retain a stable claim_id and evidence_id across protocol, result ledger, manuscript, review, response, and revision evidence.
    support_status_rule: Supported_limited, unsupported, unclear, rejected, blocked, and not_applicable statuses must not be renamed into supported without new evidence.
    path_rule: Artifact paths must point to node-local artifacts or PHMGA-owned result artifacts; graph/Canvas/dashboard paths cannot support research claims.
    provider_rule: Provider/model labels must match OpenRouter free-only and BigModel GLM-4.7-flash free-only boundaries.
  complete:
    required_success_records:
      - numerator_denominator_for_rate_metrics
      - baseline_input_budget_output_records
      - reviewer_assignment_or_seed_record
      - artifact_contract_record
      - result_md_and_artifact_dir_for_formal_rows
      - confidence_interval_or_bootstrap_interval
      - failure_distribution
    required_failure_records:
      - missing_baseline_record
      - missing_metric_definition
      - missing_repeat_or_uncertainty
      - unsupported_claim_without_boundary
      - reviewer_hard_fail_without_actionable_fix
      - metadata_h5_alignment_missing_or_failed
      - selected_backend_not_locked
      - stage_c_or_stage_d_row_missing
      - rm101_reject_evidence
      - provider_rate_limit_or_policy_failure
      - claim_evidence_registry_schema_failure
  exercisable:
    worker_can_execute_without_redefining:
      - fixed_node_set
      - claim_universe
      - baselines
      - primary_metric
      - secondary_metrics
      - formal_row_denominator
      - artifact_outputs
      - stop_conditions
    minimum_execution_inputs:
      - research prompt bundle
      - acceptance checklist
      - review rubric
      - allowed edit scope
      - PHMGA submodule reference
      - Vibench read boundary
      - provider/model policy
      - output ledger schema
    missing_input_policy: Missing command, manual operation form, reviewer assignment, result ledger schema, or formal row denominator blocks result claims.
  statistics_plan:
    rate_metrics:
      estimator: proportion
      uncertainty: confidence_interval_or_bootstrap_interval
      denominator_required: true
    repeated_conditions:
      repeat_unit: random_seed_or_independent_reviewer_assignment
      low_power_policy: low repeat budget must be reported and blocks strong claims
    formal_rows:
      denominator: preregistered_stage_c_and_stage_d_rows
      pass_rule: every eligibility gate must pass for selection-eligible formal claim
      failure_distribution_required: true
  budget_plan:
    workflow_comparison_budget:
      equality_rule: same node set, token/time budget, reviewer rubric, and artifact audit procedure across conditions
      budget_missing_action: downgrade to protocol-ready
    provider_budget:
      openrouter: free_model_only
      bigmodel: GLM-4.7-flash_free_only
      rate_limit_action: record blocker or reject evidence
    data_budget:
      formal_scope:
        - RM_017_Ottawa19
        - RM_101_THU_GEARBOX
      adapter_alignment_required: true
    submodule_budget:
      phmga_commit: 914bc5925d5230917a5de95d88784075fb2b041e
      dirty_entries_count: 66
      pointer_update_allowed_now: false
  stop_conditions:
    - id: P1_07_STOP_001_CHERRY_PICKED_METRIC
      trigger: favorable secondary metric is promoted while primary metric or formal eligibility gate fails
      action: block claim and record failure interpretation
    - id: P1_07_STOP_002_BASELINE_MISSING
      trigger: required baseline lacks input, budget, output, reviewer, or artifact record
      action: downgrade to protocol-ready
    - id: P1_07_STOP_003_UNCERTAINTY_MISSING
      trigger: point estimate reported without repeat or uncertainty statement
      action: block strong result claim
    - id: P1_07_STOP_004_FORMAL_GATE_MISSING
      trigger: provider, adapter, artifact contract, selected backend, Stage C, or Stage D gate is missing or failed
      action: preserve blocker/reject evidence
    - id: P1_07_STOP_005_NEGATIVE_EVIDENCE_HIDDEN
      trigger: unsupported, unclear, rejected, rate-limited, or failed rows disappear from ledger
      action: block submission-ready claim

legacy_node_path: research/P1_实验设计与仓库蓝图/P1_07_优化目标_任务_评测协议
node_path: research/P1_实验设计与仓库蓝图/P1_07_优化目标_任务_评测协议
research_anchor: AutoResearch as a human-agent research operating system
protocol_id: fixed_node_set_controlled_comparison_v1
objective:
  statement: Evaluate whether AutoResearch improves auditability and phase-transition discipline in research-node production.
  boundary: This protocol evaluates research-process quality, not domain-model performance.
primary_outcome:
  name: claim_evidence_validity_rate
  direction: maximize
  numerator: claims with valid claim_id, evidence_id, artifact path, citation status, boundary, and reviewer/human-gate status
  denominator: all eligible proposal, manuscript, review, and response claims in the fixed node set
  success_criterion: AutoResearch exceeds preregistered baselines under identical node set, budget, rubric, and audit procedure while reporting uncertainty and failure cases.
secondary_outcomes:
  - protocol_completeness
  - independent_reviewer_pass_rate
  - reproducibility_rerun_agreement
  - unsupported_claim_count
  - hard_fail_closure_rate
  - human_gate_escalation_rate
  - time_to_author_exit
task_families:
  - id: p0_problem_formulation
    input: research prompt, acceptance checklist, related-work notes
    output: gap map, candidate claims, innovation boundary, evidence gate
    success_criterion: each research content unit maps to problem, prior-work boundary, evidence, and downgrade rule
  - id: p1_protocol_design
    input: candidate claims and research object
    output: protocol_map, metrics, baselines, repeat plan, uncertainty plan, negative result policy
    success_criterion: objective, task, protocol, metrics, baseline, and artifact path are aligned
  - id: p2_methods_and_claim_registry
    input: protocol and available evidence artifacts
    output: methods draft, claim_evidence_registry, data-code/protocol availability statements, limitation boundary
    success_criterion: a reviewer can reproduce data, parameters, statistics, and code path from the method record
  - id: p3_p4_review_response
    input: manuscript version, reviewer comments, evidence registry
    output: critique severity map, revision actions, point-to-point response, coverage check
    success_criterion: every fatal or major concern maps to evidence, location, action, and response status
baselines:
  - id: manual_checklist_workflow
    role: human-process baseline
    required_record: manual operation ledger, elapsed time, evidence artifact list, reviewer verdict
  - id: prompt_only_agent_workflow
    role: text-generation baseline
    required_record: prompt, output, budget, reviewer verdict, unsupported claim count
  - id: agent_without_independent_gate
    role: gate ablation
    required_record: same node contract without independent reviewer or human gate
fair_comparison_controls:
  - identical fixed node set
  - identical acceptance checklist and review rubric
  - identical time or token budget
  - identical artifact audit procedure
  - identical primary and secondary metric definitions
repeat_and_uncertainty:
  repeat_unit: random seed or independent reviewer assignment
  minimum_report: point estimate plus confidence interval or bootstrap interval
  low_power_policy: if repeat budget is insufficient, report limitation and block strong result claims
failure_cases:
  - missing_baseline_record
  - missing_metric_definition
  - missing_repeat_or_uncertainty
  - unsupported_claim_without_boundary
  - reviewer_hard_fail_without_actionable_fix
  - author_exit_used_as_node_close
required_artifacts:
  - artifacts/protocol_map.yaml
  - artifacts/gate_report.md
  - artifacts/experiment_rigor_plan.yaml
  - future_artifacts/result_ledger.yaml
  - future_review/verdict.yaml
  - future_logs/coverage_matrix.md
author_exit:
  gate_inputs_verified: true
  blocking_gaps_are_explicit: true
