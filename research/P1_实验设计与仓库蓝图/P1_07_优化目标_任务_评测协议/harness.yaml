  - docs/*.md
  - artifacts/*.md
  - artifacts/*.yaml
  - artifacts/*.json
  - logs/*.md
  - logs/*.json
  cannot_modify:
  - README.md
  - status.yaml
  - docs/HUMAN_ONLY.md
expected_outputs:
