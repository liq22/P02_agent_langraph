  - docs/manuscript.md
  secondary:
  - logs/eval_report.md
  - logs/claim_evidence_map.md
validators:
- id: markdown_structure
  required: true
- id: acceptance_checklist
  required: true
- id: edit_scope_check
  required: true
- id: node_status_check
  required: true
scorecard:
  pass_threshold: 0.8
  dimensions:
    reproducibility: 0.25
    baseline_fairness: 0.2
    metric_definition: 0.2
    data_availability: 0.2
    artifact_plan: 0.15
human_gate:
  required_before_stage_change: true
  protected_files:
  - status.yaml
  - README.md
  - docs/HUMAN_ONLY.md
stop_rules:
- missing_required_input
- validator_failed
- score_below_threshold
- human_gate_required
