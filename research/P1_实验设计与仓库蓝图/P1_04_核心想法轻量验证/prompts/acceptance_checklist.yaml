node_id: research::P1_实验设计与仓库蓝图::P1_04_核心想法轻量验证
node_path: research/P1_实验设计与仓库蓝图/P1_04_核心想法轻量验证
phase: P1
node_kind: leaf
prompt_assets:
- path: prompts/research_prompt.md
  status: required
- path: prompts/acceptance_checklist.yaml
  status: required
- path: prompts/review_rubric.yaml
  status: required
required_questions_answered:
- item: baseline 是什么？
  status: pending
- item: primary metric 是什么？
  status: pending
- item: 这一轮只改变哪个概念因素？
  status: pending
- item: 什么结果算 keep，什么结果算 discard？
  status: pending
required_outputs:
- path: artifacts/gate_report.md
  status: pending
  description: profile-required local artifact；blocker-prep 回合也必须形成或更新
- path: artifacts/auto_experiment/results.tsv
  status: pending
  description: 仅在 contract_mode == executable 且进入实际执行回合时需由本节点形成或更新
- path: logs/auto_experiment/latest_run.log
  status: pending
  description: 仅在 contract_mode == executable 且进入实际执行回合时需由本节点形成或更新
- path: 轻量验证结论摘要
  status: pending
  description: 执行回合给 keep/discard 结论；blocker-prep 回合给 handoff summary
quality_checks:
- item: 围绕 baseline、metric、protocol、reproducibility、artifact 完整性组织内容
  status: pending
- item: 明确 documented / consistent / complete / exercisable 的最低要求
  status: pending
- item: baseline-first、metric-driven、单轮单变化、可回滚
  status: pending
- item: 记录 variance/statistical validity、failure interpretation 与 reproducibility
    风险，不把单次波动写成稳定结论
  status: pending
- item: 不要猜 execution contract
  status: pending
- item: repo_path 在 workspace 中可解析到真实验证仓库；否则只能 blocker-handoff
  status: pending
- item: 节点产物必须能通过独立 reviewer agent 基于 `prompts/review_rubric.yaml` 的外部评审。
  status: pending
- item: hard-gate block 必须绑定 claim_id/evidence_id/location/actionable_fix；否则只能作为 advisory
    critique。
  status: pending
handoff_ready_if:
- item: contract 完整且 `contract_mode` 明确
  status: pending
- item: 若未进入执行回合，gate_report 已明确 repo_path/run_command/metric/baseline 缺口与下一交接节点
  status: pending
- item: 至少形成 1 次 baseline 与 1 次受控尝试的账本
  status: pending
- item: keep/discard 结论明确
  status: pending
- item: 独立 reviewer agent 已生成 `review/verdict.yaml`
  status: pending
- item: '`review/verdict.yaml` 中 `review_complete == true`'
  status: pending
- item: '`review/verdict.yaml` 中 `overall_verdict == pass`'
  status: pending
- item: '`review/verdict.yaml` 中 `hard_fail == false`'
  status: pending
- item: '`review/verdict.yaml` 中 `independence_confirmed == true`'
  status: pending
stop_if:
- item: 缺关键输入或关键证据
  status: pending
- item: execution contract 缺失、字段不完整或 mode 仍为 `review_only` 时，只允许转交 contract-prep
  status: pending
- item: repo_path 缺失、路径不存在或 run target 不可绑定时，只允许转交 blocker handoff
  status: pending
- item: 本节点范围不清或越出节点职责
  status: pending
- item: 必须依赖的上游节点尚未就绪
  status: pending
- item: 缺少独立 reviewer verdict (`review/verdict.yaml`)
  status: pending
- item: 独立 reviewer verdict 尚未完成 (`review_complete != true`)
  status: pending
- item: 独立 reviewer 判定为 `revise` 或 `block`
  status: pending
- item: 独立 reviewer 提出 hard fail 且未关闭
  status: pending
- item: hard gate 缺 citation/figure/venue/coverage/revision evidence 中的适用工件。
  status: pending
- item: blocking issue 没有 claim_id/evidence_id/location/actionable_fix。
  status: pending
review_notes:
- slot: 1
  note: <待填写>
- slot: 2
  note: <待填写>
external_review_gate:
  required: true
  reviewer_role: external_node_reviewer
  reviewer_agent_must_be_distinct: true
  rubric_path: prompts/review_rubric.yaml
  verdict_path: review/verdict.yaml
  pass_condition:
    review_complete: true
    overall_verdict: pass
    hard_fail: false
    independence_confirmed: true
  required_reviewer_inputs:
  - README.md
  - status.yaml
  - prompts/research_prompt.md
  - prompts/acceptance_checklist.yaml
  - prompts/review_rubric.yaml
  - artifacts/execution_contract.yaml
  - docs/manuscript.md
  - artifacts/auto_experiment/results.tsv (若进入 executable round)
  - logs/auto_experiment/latest_run.log (若进入 executable round)
  - 轻量验证结论摘要
  - artifacts/gate_report.md
author_exit:
- item: 'gate_inputs_verified: true'
  status: pending
- item: 'blocking_gaps_are_explicit: true'
  status: pending
node_close:
- item: 'review/verdict.yaml:review_complete: true'
  status: pending
- item: 'review/verdict.yaml:overall_verdict: pass'
  status: pending
- item: 'review/verdict.yaml:hard_fail: false'
  status: pending
- item: 'review/verdict.yaml:independence_confirmed: true'
  status: pending
