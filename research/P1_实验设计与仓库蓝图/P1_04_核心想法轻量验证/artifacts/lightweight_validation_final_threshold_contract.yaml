  limitation: Full formal promotion still requires real-data protocol rows, repeated-run or variance evidence, selected-backend lock, and downstream Stage C/D acceptance.

artifact_consistency:
  results_tsv: artifacts/auto_experiment/results.tsv
  consistency_checks:
    - results_tsv baseline test accuracy equals baseline metrics.json test.accuracy
    - results_tsv baseline test macro_f1 equals baseline metrics.json test.macro_f1
    - results_tsv controlled attempt test accuracy equals attempt metrics.json test.accuracy
    - results_tsv controlled attempt test macro_f1 equals attempt metrics.json test.macro_f1
    - both rows have finite test.accuracy and test.macro_f1
    - both rows have artifact directories recorded in results.tsv and gate_report.md
  metric_truth: metrics_json_for_each_row
  decision_truth: execution_contract_keep_discard_rule_plus_results_tsv
  forbidden_truth_sources:
    - narrative final_report without metrics refs
    - review files
    - graph or dashboard projections
    - partial formal provider rows
    - reject evidence rows

node_vs_global_readiness:
  p1_04_may_claim:
    - baseline-first lightweight synthetic/offline validation completed
    - controlled attempt improved the declared primary metric under the bounded synthetic setup
    - replay trace is sufficient for P1_04/P1_05 handoff
    - result is a limited mechanism signal and not formal performance evidence
  p1_04_must_not_claim:
    - selected_global_best_backend is locked
    - RM101 Stage B reject evidence is resolved
    - adapter sample-level metadata-H5 preflight is complete
    - real-data Stage C main-result rows have passed
    - Stage D ablation rows have passed
    - P1_04 checklist/status fields are closed by this score review
    - final validator passes

reviewer_acceptance_criteria:
  - P1_04 may pass the node-specific final score threshold if the reviewer can
    trace baseline and controlled rows from declared command, cwd, exit code,
    metrics.json, results.tsv, gate report, and keep/discard decision without
    finding a duplicate metric truth source.
  - P1_04 should fail if the package promotes the synthetic/offline signal into
    Stage C/D, selected-backend, RM101 positive, or submission-ready evidence.
  - P1_04 should not be penalized for missing formal real-data rows, variance
    evidence, selected backend, adapter preflight, P3 action closure, checklist
    closure, or final validator pass when those are explicitly preserved as
    downstream blockers and not used as support.
  - P1_04 score re-review must not close canonical checklist fields; checklist
    closure remains a separate explicitly approved status operation.

global_submission_status:
  global_submission_ready: false
  remaining_global_blocker_classes:
    - P1_01-P1_05 checklist fields remain incomplete until explicit approval
    - P1/P3/P4 below-90 score nodes remain
    - P3_04 action statuses remain blocked or planned
    - selected backend and Stage C/D formal evidence remain pending
    - final validator does not pass

author_exit:
