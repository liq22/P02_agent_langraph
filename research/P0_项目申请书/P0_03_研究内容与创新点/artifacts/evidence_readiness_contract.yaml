p0_03_claim_strength_rule: >-
  P0_03 may claim that the research content and innovation boundaries are ready
  for downstream testing. It must not claim that AutoResearch has already
  improved research quality, claim validity, response closure, reproducibility,
  or PHMGA/Vibench performance.

content_unit_readiness:
  - content_id: RC1_NODE_EVIDENCE_GOVERNANCE_CONTRACT
    p0_03_status: content_boundary_ready
    reason: >-
      The contribution is bounded to node-close governance, excludes file
      presence and author exit as scientific proof, and is paired with locked
      downstream metrics: claim_evidence_validity_rate, unsupported_claim_count,
      independent_reviewer_pass_rate, and hard_fail_closure_rate.
    downstream_evidence_owner: P1/P2/P3/P4 comparative and audit nodes
    downgrade_if_missing: governance_design_only
  - content_id: RC2_CROSS_PHASE_CLAIM_EVIDENCE_PROTOCOL_CHAIN
    p0_03_status: content_boundary_ready
    reason: >-
      The contribution is bounded to durable claim identity across proposal,
      protocol, manuscript, review, and response phases, with required coverage
      audits and reviewer-confirmed support status locked as downstream tests.
    downstream_evidence_owner: P1/P2/P3/P4 claim, protocol, review, and response nodes
    downgrade_if_missing: traceability_scaffold_only
  - content_id: RC3_INDEPENDENT_REVIEW_AND_NEGATIVE_RESULT_GATE
    p0_03_status: content_boundary_ready
    reason: >-
      The contribution is bounded to phase-transition control by distinct
      review, response coverage, failure registers, and retained negative
      evidence, not to review-file count or reviewer prose volume.
    downstream_evidence_owner: P3/P4 review-response and revision-evidence nodes
    downgrade_if_missing: author_exit_only
  - content_id: RC4_FORMAL_EVIDENCE_ELIGIBILITY_GATE
    p0_03_status: contribution_boundary_ready_but_empirically_blocked
    reason: >-
      The contribution is explicitly an eligibility gate for result evidence,
      not a PHMGA/Vibench algorithmic contribution. Until provider policy,
      adapter alignment, artifact contract, Stage C/D rows, and selected backend
      lock pass, it can only support blocker or reject-evidence wording.
    downstream_evidence_owner: P1/P2 formal evidence and artifact-contract nodes
    downgrade_if_missing: blocker_or_reject_evidence_only

