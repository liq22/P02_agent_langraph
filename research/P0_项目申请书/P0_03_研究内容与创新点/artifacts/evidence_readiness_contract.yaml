reviewer_acceptance_criteria:
  - P0_03 may pass final threshold if every contribution has a specific
    prior-work boundary, attack path, required downstream evidence row, and
    downgrade rule.
  - P0_03 must remain below final threshold if it presents downstream empirical
    evidence as complete or promotes implementation artifacts as scientific
    contributions.
  - P0_03 must not be penalized for missing Stage C/D rows or provider runs
    when it preserves them as downstream blockers rather than using them as
    support.

