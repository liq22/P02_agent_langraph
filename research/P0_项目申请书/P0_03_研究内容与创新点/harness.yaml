node_id: research::P0_项目申请书::P0_03_研究内容与创新点
node_path: research/P0_项目申请书/P0_03_研究内容与创新点
stage: seed
task_type: proposal_node
inputs:
  required_files:
  - README.md
  - status.yaml
  - docs/manuscript.md
  - prompts/research_prompt.md
  - prompts/acceptance_checklist.yaml
allowed_actions:
  can_modify:
  - docs/*.md
  - artifacts/*.md
  - artifacts/*.yaml
  - artifacts/*.json
  - logs/*.md
  - logs/*.json
  cannot_modify:
  - README.md
  - status.yaml
  - docs/HUMAN_ONLY.md
expected_outputs:
  primary:
  - docs/manuscript.md
  secondary:
  - logs/eval_report.md
  - logs/claim_evidence_map.md
validators:
- id: markdown_structure
  required: true
- id: acceptance_checklist
  required: true
- id: claim_evidence_check
  required: true
- id: citation_integrity
  required: true
- id: edit_scope_check
  required: true
- id: node_status_check
  required: true
scorecard:
  pass_threshold: 0.8
  dimensions:
    scientific_question: 0.25
    hypothesis_testability: 0.25
    route_clarity: 0.2
    risk_boundary: 0.15
    acceptance_metric: 0.15
human_gate:
  required_before_stage_change: true
  protected_files:
  - status.yaml
  - README.md
  - docs/HUMAN_ONLY.md
stop_rules:
- missing_required_input
- validator_failed
- score_below_threshold
- human_gate_required
