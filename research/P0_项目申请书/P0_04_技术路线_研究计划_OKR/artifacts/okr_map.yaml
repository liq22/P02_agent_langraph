route_summary: >-
  Convert P0_01-P0_03 proposal-stage problem and contribution boundaries into
  a staged evidence-governed research route whose objectives, metrics, stop
  conditions, and fallback branches are inspectable before P1/P2/P3/P4 work is
  promoted into manuscript claims.

route_readiness_contract: research/P0_项目申请书/P0_04_技术路线_研究计划_OKR/artifacts/route_readiness_contract.yaml

stages:
  - stage_id: S0_PROBLEM_CONTRIBUTION_LOCK
    phase_scope:
      - P0_01
      - P0_02
      - P0_03
    purpose: Lock falsifiable gap, science/engineering split, and bounded contribution claims.
    inputs:
      - research/P0_项目申请书/P0_01_研究背景与调研/artifacts/literature_gap_map.yaml
      - research/P0_项目申请书/P0_02_研究挑战与科学问题_工程问题/artifacts/problem_hypothesis.yaml
      - research/P0_项目申请书/P0_03_研究内容与创新点/artifacts/contribution_claims.yaml
    endpoints:
      - every contribution has claim_id, prior-work boundary, required evidence, and downgrade rule
      - implementation details are excluded from contribution claims
    observable_metrics:
      - contribution_units_with_downgrade_rule
      - contribution_units_with_required_evidence
      - vague_novelty_phrase_count
    stop_conditions:
      - contribution wording relies on first/better/automatic without evidence
      - implementation details are promoted to contribution claims
    fallback: Return to P0_03 for novelty-boundary narrowing.
  - stage_id: S1_PROTOCOL_AND_DATA_ELIGIBILITY
    phase_scope:
      - P1_01
      - P1_04
      - P1_06
      - P1_07
      - P1_08
    purpose: Bind hypotheses to baselines, budgets, metrics, provider policy, dataset adapter preflight, and artifact contract.
    inputs:
      - fixed_node_set
      - manual_checklist_baseline
      - prompt_only_agent_baseline
      - ungated_multi_agent_baseline
      - PHMGA/Vibench provider and adapter records
    endpoints:
      - provider_model_policy_pass
      - metadata_h5_alignment_pass
      - artifact_contract_pass
      - primary_and_secondary_metrics_locked
    observable_metrics:
      - protocol_map_completeness
      - baseline_budget_contract_complete
      - adapter_alignment_status
      - artifact_contract_status
    stop_conditions:
      - metadata-H5 alignment fails
      - provider/model policy violates free-model boundary
      - artifact contract fails
      - RM101 positive evidence is not selection-eligible
    fallback: Preserve blocker or reject-evidence bundle; downgrade result claim to limitation.
  - stage_id: S2_EVIDENCE_PRODUCTION_AND_BOUNDARY_PRESERVATION
    phase_scope:
      - P1_04
      - P1_05
      - P1_09
    purpose: Produce evidence rows and preserve boundary labels before manuscript claims are strengthened.
    endpoints:
      - claim_evidence_validity_rate available
      - unsupported_claim_count available
      - response_coverage_rate available
      - negative_result_retention_rate available
      - Stage C/D formal rows available when eligible
    observable_metrics:
      - claim_evidence_validity_rate
      - unsupported_claim_count
      - independent_reviewer_pass_rate
      - response_coverage_rate
      - negative_result_retention_rate
      - stage_c_main_result_pass
      - stage_d_ablation_pass
    stop_conditions:
      - synthetic/offline check is promoted as main result
      - negative or reject evidence is hidden
      - rate-limit interruption is omitted from ledger
    fallback: Keep evidence as preliminary, limitation, blocker, or reject evidence.
  - stage_id: S3_MANUSCRIPT_INTEGRATION
    phase_scope:
      - P2_01
      - P2_02
      - P2_03
      - P2_04
      - P2_05
    purpose: Integrate only registry-backed claims into manuscript and TeX surfaces.
    endpoints:
      - manuscript claims map to claim_id/evidence_id
      - figures and tables have provenance
      - citations have support status
      - export constraints and compile report are recorded
    observable_metrics:
      - claim_registry_coverage_rate
      - figure_claim_mapping_rate
      - citation_support_status_distribution
      - unsupported_claim_count
    stop_conditions:
      - manuscript claim exceeds evidence registry
      - figure lacks provenance
      - graph/Canvas/dashboard projection is treated as research truth
    fallback: Revise or downgrade manuscript claim before export.
  - stage_id: S4_INDEPENDENT_REVIEW_RESPONSE_CLOSURE
    phase_scope:
      - P3_01
      - P3_02
      - P3_03
      - P3_04
      - P4_01
      - P4_02
      - P4_03
      - P4_04
      - P4_05
      - P4_06
      - P4_07
    purpose: Close review attacks with evidence-linked response and revision records.
    endpoints:
      - review issues map to claim_id/evidence_id/location/actionable_fix
      - response coverage is complete
      - hard_fail closure is documented
      - final submission validator passes
    observable_metrics:
      - response_coverage_rate
      - hard_fail_closure_rate
      - reviewer_pass_rate
      - final_submission_validator_status
    stop_conditions:
      - hard fail lacks action map
      - response is advisory prose without evidence
      - final validator reports blockers
    fallback: Reopen target node or downgrade submission claim.

