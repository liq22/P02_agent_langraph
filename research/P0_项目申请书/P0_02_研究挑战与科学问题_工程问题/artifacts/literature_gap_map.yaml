    gap_statement: >-
      The cited representative agentic research systems and reporting policies
      motivate tool use, agent coordination, automated experimentation, paper
      writing, and publication governance, but they do not by themselves define
      a testable split between the scientific question of claim-governance
      effectiveness and the engineering question of node-local traceability.
    novelty_boundary: >-
      The proposed novelty is not a new generic agent framework or a claim that
      agents can write papers. The boundary is a measurable research-operation
      problem: whether explicit node-local claim/evidence/protocol/review gates
      improve claim validity and preserve negative evidence under fixed
      comparisons.
    falsifiable_question: >-
      Under the same fixed node set, budget, and reviewer rubric, does a gated
      AutoResearch workflow produce higher claim-evidence validity, fewer
      unsupported claims, higher response coverage, and better negative-result
      retention than manual checklist, prompt-only agent, or ungated
      multi-agent baselines?
