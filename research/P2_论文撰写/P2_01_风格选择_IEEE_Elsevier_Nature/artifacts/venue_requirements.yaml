contradiction_list:
  - contradiction_id: C001_STRONG_STORY_VS_FORMAL_EVIDENCE
    issue: Strong venue prose could imply formal PHMGA success.
    current_truth: Selected backend, metadata-H5 alignment, Stage C rows, and Stage D ablations remain incomplete.
    writing_action: Keep formal rows as eligibility-gate, blocker, reject-evidence, or future-required rows.
  - contradiction_id: C002_SYNTHETIC_SIGNAL_VS_REAL_DATA_CLAIM
    issue: The P1_04/P1_05 synthetic/offline signal can be overpromoted.
    current_truth: P1_08 c1 permits only limited synthetic/offline sanity-check wording.
    writing_action: Put synthetic signal in a bounded row with weak or supported_limited status.
  - contradiction_id: C003_RM101_ABSENCE_VS_NEGATIVE_EVIDENCE
    issue: RM101 may look omitted if only positive Ottawa rows are shown.
    current_truth: RM101 Stage B rows include reject evidence and low macro-F1 traces.
    writing_action: Preserve RM101 as reject evidence or limitation until eligible reruns pass.
  - contradiction_id: C004_NODE_PASS_VS_FINAL_SUBMISSION_THRESHOLD
    issue: Node-local pass could be mistaken for final submission quality.
    current_truth: Multiple nodes have passing verdicts but scores below 90.
    writing_action: Use reviewer gates as process evidence only; retain final-score blocker.
  - contradiction_id: C005_REPRODUCIBILITY_VS_DIRTY_SUBMODULE
    issue: PHMGA is the implementation truth but has dirty/untracked entries.
    current_truth: Parent pointer should not be updated until dirty work is protected.
    writing_action: Describe reproducibility path and current submodule boundary, not final frozen artifact.
  - contradiction_id: C006_POLICY_DISCLOSURE_VS_AGENTIC_AUTHORING
    issue: AI/agent involvement could be hidden or mislabeled.
    current_truth: Claude Code teammates are user-authorized review agents, not biological human reviewers.
    writing_action: Add transparent AI/agent contribution and review-handoff disclosure language.
  - contradiction_id: C007_GRAPH_VIEW_VS_RESEARCH_TRUTH
    issue: Graph, Canvas, dashboard, or wrapper files may be treated as evidence.
    current_truth: Those files are projection or operation surfaces only.
    writing_action: Cite node-local artifacts, PHMGA result artifacts, and reviewer verdicts only.

