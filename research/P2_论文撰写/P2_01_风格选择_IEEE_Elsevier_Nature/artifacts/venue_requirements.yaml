style_profile_details:
  - profile_id: elsevier_specialist_engineering_imrad
    role: primary_working_profile
    target_granularity: full_specialist_engineering_article
    fit_score: high_current_fit
    fit_rationale: >-
      The current package needs methods detail, reproducibility boundaries,
      table-ledger evidence, negative-result retention, and a factual
      results/discussion split. This is better served by a specialist
      engineering IMRAD article than by a compressed broad-interest format.
    title_rule: Specific, technical, and claim-bounded; avoid implying final PHMGA performance.
    abstract_rule: Factual purpose-method-result-boundary paragraph; mention blockers when formal rows remain incomplete.
    figure_rule: Use provenance-backed workflow schematic and table-linked result displays; graphical abstract is optional and must be original and claim-bounded.
    methods_rule: Central section; include node-local governance, reviewer gate, PHMGA/Vibench boundary, provider policy, artifact contract, and reproducibility path.
    results_rule: Order by evidence maturity and include blocker/reject rows in denominators.
    data_code_rule: Include data/code/protocol availability statements and PHMGA submodule/result-ledger traceability once formal rows exist.
  - profile_id: ieee_transactions_technical
    role: backup_profile
    target_granularity: concise_technical_transaction_article
    fit_score: medium_high_after_compression
    fit_rationale: >-
      IEEE style fits a technical contribution with reproducible methodology,
      explicit results, and careful discussion. It is a backup because the
      current evidence package is lengthy and must be compressed without hiding
      blockers.
    title_rule: Specific, concise, descriptive, and keyword-bearing; avoid "new" or "novel".
    abstract_rule: Single self-contained paragraph, no references, no equations, around 250 words where applicable.
    figure_rule: Use tables when exact values matter and figures when trends or workflows matter.
    methods_rule: Straightforward reproducibility narrative with enough detail for independent researchers.
    results_rule: Exact values in tables, trends in figures, and no inflated conclusion.
    disclosure_rule: AI-generated content and author-assisted workflow use must be disclosed according to IEEE policy.
  - profile_id: nature_broad_interest
    role: nonselected_stretch_quality_lens
    target_granularity: broad_science_article
    fit_score: low_current_fit_future_stretch
    fit_rationale: >-
      Nature-style constraints are useful for clarity, figures, and
      availability statements, but the current evidence does not yet support a
      broad breakthrough narrative. Selecting this profile now would encourage
      overclaiming.
    title_rule: Very short, broadly intelligible, minimal acronyms, no unsupported performance language.
    abstract_or_summary_rule: Plain-language summary paragraph must state background, rationale, and main conclusion without specialist jargon.
    figure_rule: Few compact display items, simple legends, error bars/statistics defined, readable outside the subfield.
    methods_rule: Concise but complete Methods with data and code availability statements.
    rejection_reason_now: Formal Stage C/D evidence, selected backend, RM101 treatment, and final review-score threshold are not yet complete.

venue_fit_comparison:
  title_requirements:
    ieee: concise_specific_descriptive_keyword_bearing_no_new_or_novel
    elsevier: factual_searchable_specialist_title_no_acceptance_ready_overclaim
    nature: short_broadly_intelligible_minimal_acronyms_high_general_readability
    selected_rule: Use an Elsevier/IEEE-compatible technical title until formal results mature.
  abstract_requirements:
    ieee: single_self_contained_paragraph_roughly_250_words_no_refs_or_equations
    elsevier: concise_factual_purpose_principal_results_major_conclusions_standalone
    nature: broad_summary_first_paragraph_accessible_to_scientists_outside_subfield
    selected_rule: Draft as factual IMRAD abstract and include evidence-boundary sentence.
  figure_requirements:
    ieee: use_figures_for_trends_or_workflow_and_tables_for_exact_values
    elsevier: self_explanatory_figures_tables_plus_optional_graphical_abstract
    nature: few_simple_display_items_readable_beyond_subfield_with_error_bars_defined
    selected_rule: Figure 1 should be workflow/evidence-path schematic; formal result figures wait for passed rows.
  methods_requirements:
    ieee: straightforward_reproducibility_description
    elsevier: enough_detail_for_independent_researcher_to_reproduce
    nature: concise_complete_methods_plus_data_code_protocol_availability
    selected_rule: Methods carry the main contribution and must expose protocol, review, response, negative evidence, and PHMGA gates.
  results_discussion_requirements:
    ieee: results_with_figures_tables_and_non_inflated_discussion_conclusion
    elsevier: clear_concise_results_discussion_explains_significance_without_repeating
    nature: main_text_tight_display_items_and_methods_support_interdisciplinary_claim
    selected_rule: Results are ordered by evidence maturity and blocked/reject evidence stays visible.
  disclosure_requirements:
    ieee: disclose_ai_generated_content_when_used_beyond_basic_editing
    elsevier: disclose_ai_tools_for_manuscript_preparation_and_describe_research_process_use_when_relevant
    nature: disclose_data_code_protocol_availability_and_restrictions
    selected_rule: Keep Claude/Codex teammate review transparent as user-authorized agent review, not biological human review.

