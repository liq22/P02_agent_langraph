    repository_evidence:
      - docs/submission_ready_goal/blocker_resolution_plan_current.md
      - docs/submission_ready_goal/p3_p4_action_reconciliation_current.md
      - docs/submission_ready_goal/review_score_remediation_matrix_current.md
