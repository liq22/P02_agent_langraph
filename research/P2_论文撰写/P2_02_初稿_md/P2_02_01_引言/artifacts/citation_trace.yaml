gap_claim_fit:
  intro_gap_claim: The cited systems motivate tool use, multi-agent coordination, and automated scientific writing, but the introduction only claims that the current review package needs a node-local procedure tying claims to evidence, protocol gates, independent review, response coverage, and negative-result handling before phase transition.
  support_basis:
    - representative prior-work categories are verified in the inherited citation registry
    - the stronger node-local operating-procedure gap is grounded in P0_01 literature_gap_map and P0_03 contribution_claims, not solely in citation titles
  downgrade_rule: If any source entry cannot be inspected or remains unsupported in later bibliography work, remove or narrow the associated cluster sentence rather than upgrading the manuscript claim.
