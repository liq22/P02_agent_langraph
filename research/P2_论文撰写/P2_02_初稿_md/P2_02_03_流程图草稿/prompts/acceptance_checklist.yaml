node_id: research::P2_论文撰写::P2_02_初稿_md::P2_02_03_流程图草稿
node_path: research/P2_论文撰写/P2_02_初稿_md/P2_02_03_流程图草稿
phase: P2
node_kind: leaf
prompt_assets:
- path: prompts/research_prompt.md
  status: required
- path: prompts/acceptance_checklist.yaml
  status: required
- path: prompts/revision_prompt.md
  status: recommended
- path: prompts/review_rubric.yaml
  status: required
required_questions_answered:
- item: 流程图是否反映核心步骤而非所有实现细节？
  status: done
- item: caption 是否足够自解释？
  status: done
required_outputs:
- path: 流程图草稿或说明
  status: done
  description: 需由本节点形成或更新
- path: 配套 caption 草稿
  status: done
  description: 需由本节点形成或更新
- path: docs/manuscript.md
  status: done
  description: profile-required local artifact
- path: artifacts/claim_evidence_registry.yaml
  status: done
  description: profile-required local artifact
- path: figures/fig_workflow_evidence_path.svg
  status: done
  description: node-local vector workflow figure draft
- path: artifacts/figure_plan.yaml
  status: done
  description: figure objective, provenance, claim/evidence mapping, and boundary plan
- path: artifacts/figure_manifest.yaml
  status: done
  description: accepted figure manifest with source, output, claim_ref, evidence_ref, first callout, caption, and quality checks
quality_checks:
- item: 围绕 IMRAD、methods 可复现、results 顺序、figure/table 自解释、venue format 组织内容
  status: done
- item: 正文服务主张，不重复图表，不夸大结论
  status: done
- item: 图简洁、panel 合理、文字尽量放 legend
  status: done
- item: 节点产物必须能通过独立 reviewer agent 基于 `prompts/review_rubric.yaml` 的外部评审。
  status: done
handoff_ready_if:
- item: 流程图能独立辅助理解方法
  status: done
- item: caption 与正文不矛盾
  status: done
- item: 独立 reviewer agent 已生成 `review/verdict.yaml`
  status: done
- item: '`review/verdict.yaml` 中 `review_complete == true`'
  status: done
- item: '`review/verdict.yaml` 中 `overall_verdict == pass`'
  status: done
- item: '`review/verdict.yaml` 中 `hard_fail == false`'
  status: done
- item: '`review/verdict.yaml` 中 `independence_confirmed == true`'
  status: done
stop_if:
- item: 缺关键输入或关键证据
  status: pending
- item: 本节点范围不清或越出节点职责
  status: pending
- item: 必须依赖的上游节点尚未就绪
  status: pending
- item: 缺少独立 reviewer verdict (`review/verdict.yaml`)
  status: pending
- item: 独立 reviewer verdict 尚未完成 (`review_complete != true`)
  status: pending
- item: 独立 reviewer 判定为 `revise` 或 `block`
  status: pending
- item: 独立 reviewer 提出 hard fail 且未关闭
  status: pending
- item: 核心 claim 没有 claim_id/evidence_id，或 evidence registry 与正文不一致。
  status: pending
- item: 负结果、失败实验、反例或限制被删除、隐藏或改写成正结果。
  status: pending
review_notes:
- slot: 1
  note: External AI reviewer passed P2_02_03 with score 86, hard_fail false, downstream_ready true, and independence confirmed; no required actions remained.
- slot: 2
  note: User-authorized Claude Code teammate delegate passed the human-review slot with a valid v2 handoff; remaining notes are production-layout polish and global blockers outside this node.
external_review_gate:
  required: true
  reviewer_role: external_node_reviewer
  reviewer_agent_must_be_distinct: true
  rubric_path: prompts/review_rubric.yaml
  verdict_path: review/verdict.yaml
  pass_condition:
    review_complete: true
    overall_verdict: pass
    hard_fail: false
    independence_confirmed: true
  required_reviewer_inputs:
  - README.md
  - status.yaml
  - prompts/research_prompt.md
  - prompts/acceptance_checklist.yaml
  - prompts/review_rubric.yaml
  - ../artifacts/outline_map.yaml
  - docs/manuscript.md
  - figures/fig_workflow_evidence_path.svg
  - 流程图草稿或说明
  - 配套 caption 草稿
  - artifacts/figure_plan.yaml
  - artifacts/figure_manifest.yaml
  - artifacts/claim_evidence_registry.yaml
author_exit:
- item: 'claim_evidence_ids_are_explicit_or_gap_is_reported: true'
  status: done
- item: 'negative_or_failed_results_recorded: true'
  status: done
- item: 'protected_paths_respected: true'
  status: done
node_close:
- item: 'review/verdict.yaml:review_complete: true'
  status: done
- item: 'review/verdict.yaml:overall_verdict: pass'
  status: done
- item: 'review/verdict.yaml:hard_fail: false'
  status: done
- item: 'review/verdict.yaml:independence_confirmed: true'
  status: done
