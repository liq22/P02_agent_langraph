max_hours: 4
child_scan_order:
- P2_02_01_引言
- P2_02_02_preliminary
- P2_02_03_流程图草稿
- P2_02_04_方法
- P2_02_05_实验与讨论
enabled_skills: []
agent_read_exclude:
- docs/HUMAN_ONLY.md
review_requirement:
  ai: 1
  human: 0
human_interaction:
  mode: on_demand
  triggers:
  - missing_research_input
  - unresolved_scientific_tradeoff
  - legal_or_ethics_blocker
  - reviewer_block_not_closed
  - final_submission_approval
freeze_when:
- ai_review_count >= 1
- all_comments_responded == true
- all_children_ready == true
