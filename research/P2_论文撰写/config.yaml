max_hours: 4
child_scan_order:
- P2_01_风格选择_IEEE_Elsevier_Nature
- P2_02_初稿_md
- P2_03_定稿_tex
- P2_04_形式检查
- P2_05_去AI味道
enabled_skills: []
agent_read_exclude:
- docs/HUMAN_ONLY.md
review_requirement:
  ai: 1
  human: 0
human_interaction:
  mode: on_demand
  triggers:
  - missing_research_input
  - unresolved_scientific_tradeoff
  - legal_or_ethics_blocker
  - reviewer_block_not_closed
  - final_submission_approval
freeze_when:
- ai_review_count >= 1
- all_comments_responded == true
- all_children_ready == true
