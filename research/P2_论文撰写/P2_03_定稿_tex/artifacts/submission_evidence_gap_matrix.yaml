blocked_claims_until_closure:
  - claim: selected global backend
    blocker: selected_global_best_backend.status is pending
    closure_criteria:
      - at least one backend has accepted Stage B evidence on both Ottawa and RM101
      - selection_status.json marks selected_from_stage_b as true
  - claim: cross-dataset real-data performance improvement
    blocker: current accepted real-data rows cover Ottawa only; RM101 rows are rejected
    closure_criteria:
      - accepted Ottawa and RM101 rows exist under the same backend family
      - comparison protocol and baseline rows are fixed before reporting
  - claim: RM101 Stage B resolution
    blocker: RM101 active accepted row is unavailable for the compared backends
    closure_criteria:
      - RM101 active Stage B row passes artifact contract and feature separability
      - reject evidence is retained in the comparison record after acceptance
  - claim: Stage C/D empirical success
    blocker: Stage C/D rows are locked by pending Stage B selection
    closure_criteria:
      - Stage C main-result rows accepted
      - Stage D ablation rows accepted
  - claim: statistical significance or variance-supported effect
    blocker: current evidence lacks repeated real-data runs and variance estimates
    closure_criteria:
      - repeated real-data runs completed under the selected backend
      - variance or confidence intervals reported for the main metrics
  - claim: final submission readiness
    blocker: empirical performance, review threshold, and adapter preflight gates remain open
    closure_criteria:
      - selected backend closed
      - Stage C/D accepted
      - repeated real-data evidence summarized
      - final review score threshold reached
      - export and adapter preflight checks passed

