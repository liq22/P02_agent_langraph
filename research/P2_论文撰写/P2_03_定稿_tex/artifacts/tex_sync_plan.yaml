validation_targets:
  - tex/main.tex contains a title and problem-method-case-boundary abstract that foreground source-status preservation in manuscript claims without first-person study wording, plus introduction, evidence model, methods, results, discussion, data availability, and code availability.
  - tex/main.tex contains a bibliography with explicit references for broader method and reporting claims.
  - sync_map.yaml points to existing section files.
  - section files contain no unfilled-source markers.
  - tex/sections/preliminary.tex defines evidence units as the point where measured results become manuscript prose, table entries, or captions, and contains an evidence-status policy table that maps accepted, rejected, pending, proxy, and mechanism-level sources to allowed manuscript use and withheld claims.
  - tex/sections/experiment.tex contains a first callout to the preliminary synthetic/offline table with caption, label, and publication-facing provenance; detailed claim and evidence identifiers remain in node-local registries.
  - tex/sections/experiment.tex contains a bounded PHMGA Stage B table with accepted Ottawa rows, the pending Ottawa Codex v3 needs-rerun row, rejected RM101 rows, publication-facing provenance, and no selected-backend upgrade.
  - tex/sections/method.tex names the three claim-promotion errors used to interpret results: proxy promotion, authority inversion, and mechanism inflation.
  - tex/sections/experiment.tex states the Stage B status outcome as source-status authority over score ordering, including the point that the highest visible score is not the strongest evidence when its source verdict remains pending.
  - tex/sections/experiment.tex contains a bounded RM101 simulated-planner case table and interpretation that compare weak simulated variants, near-baseline late fusion, and the stronger time-frequency/load-normalized branch without a Stage B, online-model, or leave-domain-out upgrade.
  - tex/sections/experiment.tex closes the Results by stating the narrow supported result across the synthetic/offline, Stage B, and RM101 streams: source status remains attached while claims are formed.
  - tex/sections/introduction.tex contains a bounded contribution paragraph that identifies the evidence-unit contract and the three claim-promotion errors--proxy promotion, authority inversion, and mechanism inflation--without upgrading performance claims.
  - tex/sections/introduction.tex contains a literature-positioning paragraph that treats agent reasoning/action, verbal-feedback, and tool-use work as upstream capabilities and limits AutoResearch to downstream claim-admissibility control.
  - tex/main.tex contains a claim-boundary synthesis table that states each evidence stream's source-status decision, names the claim-promotion error it blocks, reports the claim withheld by the current evidence status, and records the missing evidence.
  - tex/main.tex contains a Discussion paragraph that distinguishes AutoResearch from generic conservative prose by tying metrics, source status, withheld claims, and closure conditions to the source record.
  - tex/main.tex contains a Discussion paragraph that retains alternative explanations for the Ottawa, Codex, and RM101 simulated-planner signals without adjudicating them from incomplete evidence.
  - tex/sections/method.tex states how each innovation claim is defined before result interpretation.
  - tex/main.tex contains a Limitations section covering scope mismatch, sparse and simulated evidence, Ottawa--RM101 transfer limits, and missing closure evidence without hiding rejected or unavailable evidence.
  - tex/main.tex contains a concise Conclusion that states the narrow method result, blocks proxy promotion, authority inversion, and mechanism inflation, and keeps backend readiness and diagnostic-performance claims open.
  - tex/main.tex contains Data and Code availability statements that identify derived metric sources, exclude raw external/private datasets, and limit claim evidence to table sources, validation scripts, and PHMGA evidence records.
  - artifacts/p2_05_tex_sync_trace.yaml records expression-calibration target status and a successful post-sync lualatex run.
  - artifacts/submission_evidence_gap_matrix.yaml maps PHMGA progress into allowed claims, blocked claims, closure criteria, and manuscript actions before any future empirical-claim upgrade.
