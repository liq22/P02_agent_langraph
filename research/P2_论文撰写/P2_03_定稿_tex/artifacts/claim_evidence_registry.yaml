  - claim_id: P2_03_C05_PHMGA_STAGE_B_PARTIAL_EVIDENCE
    claim_type: experiment
    claim_text: >
      The PHMGA Stage B comparison record currently contains eight active
      rows: two accepted Ottawa rows, three rejected rows, and three pending
      rows; the manuscript reports the metric-bearing subset, including the
      pending Ottawa Codex row withheld after provider fallback, as evidence for
      status preservation by showing that the highest visible score is not the
      strongest evidence when source verdicts remain unresolved, rejected, or
      dataset-limited. The Stage B text keeps source-status authority over
      score ordering rather than selected-backend or cross-dataset performance
      claims.
