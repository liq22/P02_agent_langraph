  - claim_id: P2_03_C06_RM101_SIMULATED_CASE_STUDY
    claim_type: experiment
    claim_text: >
      The RM101 all-domain mixed thesis case supports a limited mechanism claim:
      within the documented mixed-domain protocol, two simulated variants remain
      poor, late fusion stays near the real BigModel baseline, and only the
      branch combining time-frequency structure with load normalization records
      stronger accuracy and macro-F1 than the baseline. This supports a concrete
      branch for a formal RM101 run; it does not establish online Gemini
      performance, Stage B acceptance, cross-dataset generalization, or
      statistical significance.
    support_status: supported_limited
    manuscript_location: research/P2_论文撰写/P2_03_定稿_tex/tex/sections/experiment.tex
    action: report_with_boundary
