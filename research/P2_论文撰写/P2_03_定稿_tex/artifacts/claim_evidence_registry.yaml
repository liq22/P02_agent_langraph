      methodological contribution for preserving source status in manuscript
      claims: evidence units keep protocol, artifact, source status, allowed
      use, and closure condition attached to the constrained statement; the
      contribution is evaluated through three claim-promotion errors--proxy
      promotion, authority inversion, and mechanism inflation--using the
      synthetic/offline, PHMGA Stage B, and RM101 simulated-planner evidence
      streams without turning the comparison into a backend ranking or
      diagnostic-performance claim.
    support_status: supported
    manuscript_location: research/P2_论文撰写/P2_03_定稿_tex/tex/main.tex and research/P2_论文撰写/P2_03_定稿_tex/tex/sections/introduction.tex
