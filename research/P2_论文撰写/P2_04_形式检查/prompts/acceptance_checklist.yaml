node_id: research::P2_论文撰写::P2_04_形式检查
node_path: research/P2_论文撰写/P2_04_形式检查
phase: P2
node_kind: leaf
prompt_assets:
- path: prompts/research_prompt.md
  status: required
- path: prompts/acceptance_checklist.yaml
  status: required
- path: prompts/revision_prompt.md
  status: recommended
- path: prompts/review_rubric.yaml
  status: required
required_questions_answered:
- item: 标题、摘要、图表、references、units、availability statements 是否合规？
  status: done
- item: 是否存在明显结构/格式缺失？
  status: done
required_outputs:
- path: artifacts/formal_check_report.md
  status: done
  description: 需由本节点形成或更新
- path: artifacts/gate_report.md
  status: done
  description: profile-required local artifact
- path: artifacts/citation_registry.yaml
  status: done
  description: profile-required local artifact
- path: artifacts/figure_manifest.yaml
  status: done
  description: profile-required local artifact
- path: artifacts/venue_requirements.yaml
  status: done
  description: profile-required local artifact
quality_checks:
- item: 围绕 IMRAD、methods 可复现、results 顺序、figure/table 自解释、venue format 组织内容
  status: done
- item: 正文服务主张，不重复图表，不夸大结论
  status: done
- item: 只报告高置信结构/格式问题
  status: done
- item: 不在此节点重写科学内容
  status: done
- item: 检查 citation criticality、core-claim block、figure provenance/first_callout_location
    与 venue_requirements.yaml
  status: done
- item: 节点产物必须能通过独立 reviewer agent 基于 `prompts/review_rubric.yaml` 的外部评审。
  status: done
- item: hard-gate block 必须绑定 claim_id/evidence_id/location/actionable_fix；否则只能作为 advisory
    critique。
  status: done
handoff_ready_if:
- item: 形成一版 formal check 报告
  status: done
- item: 问题按严重性排序
  status: done
- item: 独立 reviewer agent 已生成 `review/verdict.yaml`
  status: done
- item: '`review/verdict.yaml` 中 `review_complete == true`'
  status: done
- item: '`review/verdict.yaml` 中 `overall_verdict == pass`'
  status: done
- item: '`review/verdict.yaml` 中 `hard_fail == false`'
  status: done
- item: '`review/verdict.yaml` 中 `independence_confirmed == true`'
  status: done
stop_if:
- item: 缺关键输入或关键证据
  status: pending
- item: 本节点范围不清或越出节点职责
  status: pending
- item: 必须依赖的上游节点尚未就绪
  status: pending
- item: 缺少独立 reviewer verdict (`review/verdict.yaml`)
  status: pending
- item: 独立 reviewer verdict 尚未完成 (`review_complete != true`)
  status: pending
- item: 独立 reviewer 判定为 `revise` 或 `block`
  status: pending
- item: 独立 reviewer 提出 hard fail 且未关闭
  status: pending
- item: hard gate 缺 citation/figure/venue/coverage/revision evidence 中的适用工件。
  status: pending
- item: blocking issue 没有 claim_id/evidence_id/location/actionable_fix。
  status: pending
review_notes:
- slot: 1
  note: external AI reviewer passed with score 87, hard_fail false, downstream_ready true.
- slot: 2
  note: user-authorized Claude Code teammate delegate passed the human-review slot with a valid v2 handoff.
external_review_gate:
  required: true
  reviewer_role: external_node_reviewer
  reviewer_agent_must_be_distinct: true
  rubric_path: prompts/review_rubric.yaml
  verdict_path: review/verdict.yaml
  pass_condition:
    review_complete: true
    overall_verdict: pass
    hard_fail: false
    independence_confirmed: true
  required_reviewer_inputs:
  - README.md
  - status.yaml
  - prompts/research_prompt.md
  - prompts/acceptance_checklist.yaml
  - prompts/review_rubric.yaml
  - docs/manuscript.md
  - ../P2_01_风格选择_IEEE_Elsevier_Nature/artifacts/venue_requirements.yaml
  - ../P2_03_定稿_tex/artifacts/citation_registry.yaml
  - ../P2_02_初稿_md/P2_02_03_流程图草稿/artifacts/figure_manifest.yaml
  - artifacts/formal_check_report.md
  - artifacts/gate_report.md
  - artifacts/citation_registry.yaml
  - artifacts/figure_manifest.yaml
  - artifacts/venue_requirements.yaml
author_exit:
- item: 'gate_inputs_verified: true'
  status: done
- item: 'blocking_gaps_are_explicit: true'
  status: done
node_close:
- item: 'review/verdict.yaml:review_complete: true'
  status: done
- item: 'review/verdict.yaml:overall_verdict: pass'
  status: done
- item: 'review/verdict.yaml:hard_fail: false'
  status: done
- item: 'review/verdict.yaml:independence_confirmed: true'
  status: done
