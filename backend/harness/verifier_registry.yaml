# Verifier Registry v0.1
# 每个 verifier 对应 backend/evaluators 中的一个函数。

validators:
  markdown_structure:
    module: backend.evaluators.markdown_structure
    function: validate
    applies_to:
      - proposal_node
      - experiment_node
      - manuscript_node
      - review_node
      - response_node
      - generic_node
  acceptance_checklist:
    module: backend.evaluators.acceptance_checklist
    function: validate
    applies_to:
      - proposal_node
      - experiment_node
      - manuscript_node
      - review_node
      - response_node
      - generic_node
  claim_evidence_check:
    module: backend.evaluators.claim_evidence_check
    function: validate
    applies_to:
      - manuscript_node
      - proposal_node
      - response_node
  citation_integrity:
    module: backend.evaluators.citation_integrity
    function: validate
    applies_to:
      - manuscript_node
      - proposal_node
      - response_node
  edit_scope_check:
    module: backend.evaluators.edit_scope_check
    function: validate
    applies_to:
      - proposal_node
      - experiment_node
      - manuscript_node
      - review_node
      - response_node
      - generic_node
  latex_build:
    module: backend.evaluators.latex_build
    function: validate
    applies_to:
      - manuscript_node
  response_coverage_check:
    module: backend.evaluators.response_coverage_check
    function: validate
    applies_to:
      - response_node
      - review_node
  node_status_check:
    module: backend.evaluators.node_status_check
    function: validate
    applies_to:
      - proposal_node
      - experiment_node
      - manuscript_node
      - review_node
      - response_node
      - generic_node
