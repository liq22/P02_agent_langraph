profile_defaults:
  routing_parent:
    node_researcher_lens:
    - 只做 coordination/routing/summary；不得替 leaf 节点产出正文、实验或评审结论。
    author_exit_if:
      child_frontier_checked: true
      route_child_first_or_frontier_gap_reported: true
      no_leaf_content_authored_in_parent: true
    node_close_if:
      all_required_children_closed_or_blocked_with_reason: true
      parent_rollup_consistent_with_child_artifacts: true
    blocking_failure_modes:
    - 父节点替 leaf 节点产出正文、实验、图表或审稿结论。
    - 存在 ready child 但父节点继续深写，导致 route_child_first 被忽略。
  lite_research_leaf:
    node_researcher_lens:
    - 用最小证据回答本节点关键研究判断；不靠增加 skill 数量冒充质量。
    - 明确 claim/evidence 缺口，无法验证时写 gap，不写确定事实。
    required_artifacts: [docs/manuscript.md]
    author_exit_if:
      required_artifacts_exist: true
      key_research_judgment_answered_or_gap_reported: true
      citation_status_checked_when_external_sources_are_used: true
    node_close_if:
      review/verdict.yaml:review_complete: true
      review/verdict.yaml:overall_verdict: pass
      review/verdict.yaml:hard_fail: false
      review/verdict.yaml:independence_confirmed: true
    blocking_failure_modes:
    - 缺少本节点关键研究判断，或把未验证引用/证据写成确定事实。
    - 作者退出条件与节点关闭条件混用，导致未评审内容伪装完成。
  evidence_leaf:
    node_researcher_lens:
    - 直接产出证据、图表、claim map 或协议的节点必须保留 claim/evidence 身份层。
    - 负结果、失败解释和 keep/discard 决策是一等工件，不得被正结果叙事覆盖。
    required_artifacts:
    - artifacts/claim_evidence_registry.yaml
    - artifacts/failure_register.yaml
    - artifacts/negative_result_note.md
    - artifacts/keep_discard_ledger.yaml
    author_exit_if:
      claim_evidence_ids_are_explicit_or_gap_is_reported: true
      negative_or_failed_results_recorded: true
      read_only_paths_respected: true
    node_close_if:
      review/verdict.yaml:review_complete: true
      review/verdict.yaml:overall_verdict: pass
      review/verdict.yaml:hard_fail: false
      review/verdict.yaml:independence_confirmed: true
    blocking_failure_modes:
    - 核心 claim 没有 claim_id/evidence_id，或 evidence registry 与正文不一致。
    - 负结果、失败实验、反例或限制被删除、隐藏或改写成正结果。
  hard_gate:
    node_researcher_lens:
    - 只在 review/submission/venue/response gate 阶段 hard block；authoring 阶段只能报告缺口。
    - hard fail 必须带 claim_id/evidence_id/location/actionable_fix，否则降级为 advisory critique。
    required_artifacts:
    - artifacts/gate_report.md
    author_exit_if:
      gate_inputs_verified: true
      blocking_gaps_are_explicit: true
    node_close_if:
      review/verdict.yaml:review_complete: true
      review/verdict.yaml:overall_verdict: pass
      review/verdict.yaml:hard_fail: false
      review/verdict.yaml:independence_confirmed: true
    blocking_failure_modes:
    - hard gate 缺 citation/figure/venue/coverage/revision evidence 中的适用工件。
    - blocking issue 没有 claim_id/evidence_id/location/actionable_fix。
phase_profile_defaults:
  P0:
    lite_research_leaf:
      node_researcher_lens:
      - 像 PI 一样收敛 nearest prior work、真实 gap、科学/工程边界、可证伪问题和 feasibility。
      required_artifacts: [docs/manuscript.md, artifacts/literature_gap_map.yaml]
    evidence_leaf:
      required_artifacts: [docs/manuscript.md, artifacts/claim_evidence_registry.yaml, artifacts/risk_decision_map.yaml]
  P1:
    evidence_leaf:
      node_researcher_lens:
      - 像实验负责人一样保护 data split、baseline、metric、variance/statistical validity、failure interpretation 和 reproducibility。
      required_artifacts: [artifacts/claim_evidence_registry.yaml, artifacts/failure_register.yaml, artifacts/negative_result_note.md, artifacts/keep_discard_ledger.yaml]
  P2:
    evidence_leaf:
      node_researcher_lens:
      - 像顶会作者一样维护 one-sentence contribution、claim/evidence ID、citation/figure/venue linkage 和 limitations。
      required_artifacts: [docs/manuscript.md, artifacts/claim_evidence_registry.yaml]
    hard_gate:
      required_artifacts: [artifacts/gate_report.md, artifacts/citation_registry.yaml, artifacts/figure_manifest.yaml, artifacts/venue_requirements.yaml]
  P3:
    hard_gate:
      node_researcher_lens:
      - 像独立审稿人一样用 source isolation、severity、evidence location、affected claim 和 actionable fix 约束批评。
      required_artifacts: [artifacts/review_issue_register.yaml, artifacts/critique_digest.yaml]
  P4:
    hard_gate:
      node_researcher_lens:
      - 像负责任作者一样逐点绑定 reviewer comment、direct answer、正文位置、evidence 和 commitment status。
      required_artifacts: [artifacts/question_mapping_matrix.yaml, artifacts/coverage_check_report.yaml, artifacts/revision_evidence_map.yaml]
