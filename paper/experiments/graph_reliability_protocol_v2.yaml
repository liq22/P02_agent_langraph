    - phase1_graph_dynamic_generic_ablation_v2
    - p2_graph_vs_generic_llm_v1
    - benchmark_generic_llm_tool_agent_v1
    - graph_reliability_generic_n10_v2
  output_layout: <output_root>/<reliability_profile_id>/<repeat_id>/<arm>/<rotation>
  formal_parent_root: paper/experiments/runs/formal/graph_reliability_v2
  formal_root: paper/experiments/runs/formal/graph_reliability_v2/graph_reliability_generic_n10_v2
  results_root: paper/experiments/results/graph_reliability_v2/graph_reliability_generic_n10_v2
  formal_acceptance: paper/experiments/results/graph_reliability_v2/graph_reliability_generic_n10_v2/formal_acceptance.json
  formal_result: paper/experiments/results/graph_reliability_v2/graph_reliability_generic_n10_v2/formal_result.json
  accepted_manuscript_table: paper/assets/tables/p2_e9_reliability_results.md
  accepted_manuscript_figure: paper/assets/figures/p2_e9_reliability_primary.svg
