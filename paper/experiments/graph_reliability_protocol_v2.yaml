  forbidden_legacy_roots:
    - paper/experiments/runs/formal/graph_reliability_v1
  dry_schedule_provider_calls: forbidden
  provider_execution_authorized_by_schedule: false
  runner_commands_emitted_by_schedule: true
  analyzer_requires_accepted_complete_cohort: true
  primary_run_directories_ingested: false

claim_boundary:
  - The v2 scheduler and acceptance gate are provider-free and fail closed.
  - The dedicated reliability-v2 wrapper validates every frozen repeat, arm,
    sequence, horizon, price, profile, and output-root identity before it calls
    the shared Generic-base dynamic unit implementation. The scheduler only
    emits commands and never invokes them or reads provider environment values.
  - No P2-E9 result exists until all 160 registered non-provider terminal
    bundles pass v2 acceptance and the provider-free analyzer runs.
  - The task-primary endpoint is target-adverse replay Average Precision,
    recomputed over all 24 assigned windows within each repeat from registered
    private DataPort targets and canonical rollout submit prefixes. Grounded
    pass@1 and pass-all-10 remain explanatory reliability diagnostics.
  - The analyzer does not ingest derived evaluation.jsonl rows as target or
    prediction authority, and per-sequence Average Precision averaging is
    forbidden.
  - Results are reported alongside, never appended to or pooled with, the
    three-seed primary; v1 artifacts are forbidden inputs.
  - The accepted manuscript consumer reads only the protocol, acceptance,
    result, and active manuscript. It emits no row before 160/160 bundles and
    80/80 pairs accept, and it does not read raw runs or private DataPort input.
