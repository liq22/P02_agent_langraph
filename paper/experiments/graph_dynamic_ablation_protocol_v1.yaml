    provider_failures_before_effective_terminal: retained_as_immutable_attempts
    unresolved_provider_failure: cohort_incomplete
    non_provider_failure_policy: retain_in_denominator
    attempt_indices: contiguous_zero_based
    attempts_after_effective_terminal: forbidden
  identity_and_grouping:
    absolute_cell_key: [horizon, agent_profile_id]
    paired_episode_key: [seed, rotation, public_sequence_id, horizon]
    pool_episode_rows_across_horizons: false
    pooled_headline_graph_effect_across_horizons: forbidden
    pool_across_agent_profiles: false
    pool_across_provider_model_or_runtime_profiles: false
    p2_e7_reuses_registered_horizon_12_rows_without_duplication: true
  statistical_clarifications:
    seed_reduction: average_registered_seed_differences_within_public_sequence_cluster
    incomplete_seed_cluster: report_undefined_unless_all_3_registered_seed_pairs_are_defined
    exact_permutation_tail: two_sided_absolute_mean_cluster_difference
    exact_permutation_assignments: enumerate_all_256_sign_assignments
    bootstrap_unit: public_sequence_cluster
    bootstrap_draw: sample_8_clusters_with_replacement
    bootstrap_interval: percentile_2.5_97.5
    undefined_metric_policy: report_null_and_defined_numerator_never_impute_zero
    holm_unit: separately_within_each_registered_outcome
    ablation_family: [P2-E3, P2-E4, P2-E5, P2-E6]
    horizon_interaction_family: [P2-E2_h12_minus_h3]

amendment_policy:
  allowed_after_formal_results_observed: false
  required_for_change: new_versioned_protocol_before_any_affected_formal_inference
  changes_requiring_new_version:
    - event_derivation
    - event_id_semantics
