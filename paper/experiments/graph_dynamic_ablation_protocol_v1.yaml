runtime_and_provider_profile:
  base_runtime_contract: phase1_opaque_sample_vibration_feature_schema_v6
  event_extension_contract: phase1_public_condition_event_v1
  effective_runtime_contract: phase1_graph_dynamic_ablation_v1
  formal_provider_profile_id: openrouter_north_graph_dynamic_ablation_v1
  provider: openrouter-free
  model: cohere/north-mini-code:free
  protocol: openai_chat_completions
  input_usd_per_million: 0.0
  output_usd_per_million: 0.0
  route_switch_within_profile: forbidden
  model_switch_within_profile: forbidden
  resume_key:
    - effective_runtime_contract
    - provider
    - model
    - seed
    - rotation
    - public_sequence_id
    - horizon
