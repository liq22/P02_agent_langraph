dataset:
  dataset_id: paderborn-bearing-datacenter
  provider_name: RM_027_PU
  dataset_protocol_schema: phm_agent_dataset_protocol_v1
  dataset_protocol_status: active_phase1
  split_strategy: bearing_grouped_cyclic_four_fold
  rotation: rotation_0
  held_out_bearings: 8
  sample_handle_scheme: seeded_permutation_v1
  sample_handle_seed: 20260808
  public_condition_field: domain_id
  domain_semantics: operating_condition_identifier
  domain_value_contract:
    accepted_type: finite_integral_number
    normalization: exact_base10_integer
    expected_values: [0, 1, 2, 3]
    expected_records: 2559
    expected_missing: 0
    mismatch_policy: fail_profile_before_inference
  private_fields_forbidden_from_agent_and_event:
    - bearing_id
    - label
    - diagnosis_target
    - anomaly_target
    - fault_level
    - file

sequence_construction:
  unit: one_evaluator_private_held_out_bearing
  public_sequence_id_scheme: >-
    Sort each rotation's 12-element tuple of opaque sample handles
    lexicographically and assign sequence-0001 through sequence-0008.
  record_order: ascending_data_port_metadata_order
  master_horizon: 12
  master_selection:
    formula: "index_k = floor(k * (N - 1) / 11), k = 0,...,11"
    duplicate_index_policy: fail_profile_before_inference
    future_target_use: forbidden
  horizons: [3, 6, 12]
  horizon_sequence: "sequence_h = master_sequence[0:h]"
  independently_resample_each_horizon: false
  expected_public_domain_schedule: [1, 1, 1, 2, 2, 2, 3, 3, 3, 0, 0, 0]
  expected_change_release_indices_zero_based: [3, 6, 9]
  expected_change_count_by_horizon:
    3: 0
    6: 1
    12: 3
  claim_boundary: >-
    Metadata order and domain changes define an offline operating-condition
    stress sequence, not physical time, a fault onset, or a causal regime
    transition.

public_event_contract:
  event_name: operating_condition_change
  forbidden_event_names:
    - fault_onset
    - anomaly_onset
    - failure_onset
  release_index_base: 0
  initial_release:
    index: 0
    event: null
    reason: no_previous_released_sample
  derivation:
    current_value: >-
      normalized public domain_id of the sample newly released at index i
    previous_value: >-
      normalized public domain_id of the sample released at index i-1
    emit_if: "i > 0 and current_value != previous_value"
    emit_if_equal: false
    missing_or_invalid_value: fail_episode_construction
    permitted_inputs:
      - released_sample_id
      - released_sample_public_domain_id
      - previous_released_sample_id
      - previous_released_sample_public_domain_id
      - public_replay_index
    forbidden_inputs:
      - signal_values
      - signal_features
      - label
      - anomaly_target
      - diagnosis_target
      - bearing_id
      - evaluator_output
  delivery:
    timing: first_observation_after_current_index_is_released
    duration: one_observation_pulse
    before_release: forbidden
    future_event_visibility: forbidden
    payload:
      public_condition_event:
        event: operating_condition_change
        event_id: opaque_catalog_reference
        release_index: current_public_release_index
    recipients:
      - reactive
      - graph_full
      - graph_no_recovery_revision_edge
      - graph_no_observation_conditioned_branching
      - graph_no_persistent_graph_state
      - graph_no_replanning
    equality_rule: >-
      For a matched logical event, every recipient receives byte-equivalent
      public_condition_event content at the same released replay index.
  event_id_catalog:
    id_format: "occ-%08d"
    logical_key_fields:
      - seed
      - rotation
      - public_sequence_id
      - release_index
    deliberately_excluded_key_fields:
      - horizon
      - arm
      - graph_profile
      - provider
      - model
      - private_target
      - bearing_id
    assignment: >-
      Before inference, sort logical keys by seed, rotation,
      public_sequence_id, and release_index, then assign monotonically
      numbered opaque IDs starting at occ-00000001. No hash is used.
    uniqueness_scope: one_id_per_logical_event
    reuse_rule: >-
      The same logical event ID is referenced by every matched arm/profile and
      every nested horizon that contains that release index; distinct logical
      events must never share an ID.
    expected_logical_events: 72

shared_agent_contract:
  control: reactive
  treatment: graph_full
  shared:
    backbone_model: cohere/north-mini-code:free
    provider: openrouter-free
    inference_protocol: openai_chat_completions
    temperature: 0.2
    max_output_tokens_per_turn: 2048
    base_prompt_information: identical
    public_task_and_action_result_history: identical
    public_event_payload: identical
    tools: identical_before_graph_state_filtering
    numerical_experts: identical
    evaluator: identical
    episode_order: identical
  treatment_only_difference: >-
    Graph profiles select a current decision state and expose only that
    state's legal subset of the otherwise shared tools.
  hidden_reasoning_required: false

state_machine:
  states:
    - Inspect
    - Hypothesize
    - Analyze
    - Check
    - Monitor
    - Revise
    - Recover
    - Submit
  state_tools:
    Inspect: [data.search, data.describe, data.read_window, data.summarize]
    Hypothesize: [op.list, model.list, data.summarize]
    Analyze: [data.summarize, op.list, op.schema, op.run, model.list, model.schema]
    Check: [data.summarize, op.schema, op.run, model.list, model.schema, model.predict]
    Monitor: [data.describe, data.read_window, data.summarize, op.list, op.schema, op.run, model.list, model.schema, model.predict]
    Revise: [data.describe, data.read_window, data.summarize, op.list, op.schema, op.run, model.list, model.schema, model.predict]
    Recover: [data.describe, data.read_window, data.summarize, op.list, op.schema, op.run, model.list, model.schema, model.predict]
    Submit: [submit]
  base_state_precedence:
    - "if all horizon samples have a successful model prediction: Submit"
    - "else if the current released unpredicted sample has no successful window read: Inspect"
    - "else if neither op.list nor model.list has succeeded in the episode: Hypothesize"
    - "else if fewer than 11 successful current-sample op.run calls exist: Analyze"
    - "else: Check"
  full_router_precedence:
    - "if the immediately preceding action errored: Recover"
    - "else if the current observation carries a new operating_condition_change pulse: Monitor"
    - "else if previous_state is Monitor: Revise"
    - "else: use base_state_precedence"

graph_profiles:
  full:
    agent_profile_id: graph_dynamic_full_v1
    toggles:
      recovery_revision_edge: true
      observation_conditioned_branching: true
      persistent_graph_state: true
      replanning: true
    reachable_states: [Inspect, Hypothesize, Analyze, Check, Monitor, Revise, Recover, Submit]
    error_rule: enter_Recover
    event_rule: enter_Monitor
    post_monitor_rule: enter_Revise_after_next_non_error_non_event_observation
    router_previous_state: retained
    model_conversation_previous_state: retained
    legal_transitions:
      Inspect: [Inspect, Hypothesize, Analyze, Monitor, Recover]
      Hypothesize: [Hypothesize, Analyze, Recover]
      Analyze: [Analyze, Check, Recover]
      Check: [Inspect, Check, Submit, Recover]
      Monitor: [Monitor, Revise, Recover]
      Revise: [Inspect, Hypothesize, Analyze, Check, Monitor, Submit, Recover]
      Recover: [Inspect, Hypothesize, Analyze, Check, Monitor, Recover, Submit]
      Submit: [Recover]

  no_recovery_revision_edge:
    agent_profile_id: graph_dynamic_no_recovery_revision_edge_v1
    toggles:
      recovery_revision_edge: false
      observation_conditioned_branching: true
      persistent_graph_state: true
      replanning: true
    reachable_states: [Inspect, Hypothesize, Analyze, Check, Monitor, Submit]
    error_rule: recompute_base_state_without_forced_recovery
    event_rule: enter_Monitor
    post_monitor_rule: recompute_base_state_without_revision
    router_previous_state: retained_but_not_used_for_revision
    model_conversation_previous_state: retained
    legal_transitions:
      Inspect: [Inspect, Hypothesize, Analyze, Monitor]
      Hypothesize: [Hypothesize, Analyze]
      Analyze: [Analyze, Check]
      Check: [Inspect, Check, Submit]
      Monitor: [Inspect, Hypothesize, Analyze, Check, Monitor, Submit]
      Submit: [Submit]

  no_observation_conditioned_branching:
    agent_profile_id: graph_dynamic_no_observation_conditioned_branching_v1
    toggles:
      recovery_revision_edge: true
      observation_conditioned_branching: false
      persistent_graph_state: true
      replanning: true
    reachable_states: [Inspect, Hypothesize, Analyze, Check, Recover, Submit]
    error_rule: enter_Recover
    event_rule: event_visible_to_model_but_router_recomputes_base_state
    post_monitor_rule: not_applicable_Monitor_is_unreachable
    router_previous_state: retained
    model_conversation_previous_state: retained
    legal_transitions:
      Inspect: [Inspect, Hypothesize, Analyze, Recover]
      Hypothesize: [Hypothesize, Analyze, Recover]
      Analyze: [Analyze, Check, Recover]
      Check: [Inspect, Check, Submit, Recover]
      Recover: [Inspect, Hypothesize, Analyze, Check, Recover, Submit]
      Submit: [Recover]

  no_persistent_graph_state:
    agent_profile_id: graph_dynamic_no_persistent_graph_state_v1
    toggles:
      recovery_revision_edge: true
      observation_conditioned_branching: true
      persistent_graph_state: false
      replanning: true
    reachable_states: [Inspect, Hypothesize, Analyze, Check, Monitor, Recover, Submit]
    error_rule: enter_Recover_from_current_public_result_only
    event_rule: enter_Monitor_for_the_current_event_pulse_only
    post_monitor_rule: recompute_base_state_without_previous_state
    router_previous_state: forbidden
    model_conversation_previous_state: forbidden
    conversation_rebuild:
      every_turn: true
      retain_shared_public_action_result_history: true
      retain_prior_public_event_observations: true
      strip_prior_decision_state_fields: true
      strip_prior_state_guidance_messages: true
      include_current_state_guidance_once: true
    legal_transitions:
      Inspect: [Inspect, Hypothesize, Analyze, Monitor, Recover]
      Hypothesize: [Hypothesize, Analyze, Recover]
      Analyze: [Analyze, Check, Recover]
      Check: [Inspect, Check, Submit, Recover]
      Monitor: [Inspect, Hypothesize, Analyze, Check, Monitor, Recover, Submit]
      Recover: [Inspect, Hypothesize, Analyze, Check, Monitor, Recover, Submit]
      Submit: [Recover]

  no_replanning:
    agent_profile_id: graph_dynamic_no_replanning_v1
    toggles:
      recovery_revision_edge: true
      observation_conditioned_branching: true
      persistent_graph_state: true
      replanning: false
    reachable_states: [Inspect, Hypothesize, Analyze, Check, Monitor, Recover, Submit]
    error_rule: enter_Recover
    event_rule: enter_Monitor
    post_monitor_rule: resume_base_state_without_Revise
    router_previous_state: retained_but_not_used_for_replanning
    model_conversation_previous_state: retained
    legal_transitions:
      Inspect: [Inspect, Hypothesize, Analyze, Monitor, Recover]
      Hypothesize: [Hypothesize, Analyze, Recover]
      Analyze: [Analyze, Check, Recover]
      Check: [Inspect, Check, Submit, Recover]
      Monitor: [Inspect, Hypothesize, Analyze, Check, Monitor, Recover, Submit]
      Recover: [Inspect, Hypothesize, Analyze, Check, Monitor, Recover, Submit]
      Submit: [Recover]

experiment_design:
  seeds: [20260808, 20260809, 20260810]
  rotations: [rotation_0]
  cells_per_seed_sequence:
    horizon_3: [reactive, graph_full]
    horizon_6: [reactive, graph_full]
    horizon_12:
      - reactive
      - graph_full
      - graph_no_recovery_revision_edge
      - graph_no_observation_conditioned_branching
      - graph_no_persistent_graph_state
      - graph_no_replanning
  total_cells_per_seed_sequence: 10
  total_sequences_per_cell: 24
  expected_formal_episode_bundles: 240
  contrasts:
    P2-E2:
      cells: graph_full_minus_reactive_at_each_horizon
      interaction: "(graph_full - reactive) at h=12 minus the same difference at h=3"
    P2-E3:
      cells: graph_full_minus_graph_no_recovery_revision_edge_at_horizon_12
    P2-E4:
      cells: graph_full_minus_graph_no_observation_conditioned_branching_at_horizon_12
    P2-E5:
      cells: graph_full_minus_graph_no_persistent_graph_state_at_horizon_12
    P2-E6:
      cells: graph_full_minus_graph_no_replanning_at_horizon_12
    P2-E7:
      cells: >-
        graph_full, reactive, and graph_no_observation_conditioned_branching
        at horizon 12, conditioned only on registered operating-condition
        event deliveries
  reuse_rule: >-
    A frozen cell may serve multiple preregistered contrasts, but an episode is
    stored once and never duplicated in a denominator.

