<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="114mm" viewBox="0 0 1800 1140">
<title>PHMGraph motivation: call progress versus numerical readiness</title>
<desc>Conceptual scientific diagram. No empirical values. Labels are editable text.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#28313b"/></marker></defs>
<rect width="1800" height="1140" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#202830">
<text x="55" y="60" font-size="35" font-weight="bold" text-anchor="start">Motivation: computation progress is not numerical readiness</text>
<g id="fixed-X">
<rect x="55" y="105" width="1690" height="120" rx="10" fill="#f6f7f8" stroke="#66737e" stroke-width="2"/>
<text x="79" y="147" font-size="29" font-weight="bold" text-anchor="start">Fixed conditions Xₖ</text>
<text x="79" y="189" font-size="26" font-weight="normal" text-anchor="start">One vibration window and sampling scope · feature contract · fitted experts · catalog · model · budgets</text>
</g>
<g id="signal-contract">
<rect x="55" y="270" width="1040" height="385" rx="10" fill="#f6f7f8" stroke="#66737e" stroke-width="2"/>
<text x="79" y="312" font-size="29" font-weight="bold" text-anchor="start">a  Compatible numerical inputs</text>
</g>
<g id="window">
<rect x="90" y="420" width="205" height="100" rx="10" fill="#f6f7f8" stroke="#66737e" stroke-width="2"/>
<text x="114" y="462" font-size="29" font-weight="bold" text-anchor="start">Window w</text>
<text x="114" y="504" font-size="26" font-weight="normal" text-anchor="start">fixed scope</text>
</g>
<g id="time-roles">
<rect x="405" y="355" width="315" height="100" rx="10" fill="#f6f7f8" stroke="#66737e" stroke-width="2"/>
<text x="429" y="397" font-size="29" font-weight="bold" text-anchor="start">Six time roles</text>
<text x="429" y="439" font-size="26" font-weight="normal" text-anchor="start">RMS, kurtosis, …</text>
</g>
<g id="welch-path">
<rect x="375" y="535" width="250" height="85" rx="10" fill="#f6f7f8" stroke="#66737e" stroke-width="2"/>
<text x="399" y="577" font-size="29" font-weight="bold" text-anchor="start">Welch PSD</text>
</g>
<g id="band-roles">
<rect x="715" y="535" width="320" height="85" rx="10" fill="#f6f7f8" stroke="#66737e" stroke-width="2"/>
<text x="739" y="577" font-size="29" font-weight="bold" text-anchor="start">Four band roles</text>
</g>
<g id="expert-input">
<rect x="805" y="355" width="230" height="100" rx="10" fill="#f6f7f8" stroke="#66737e" stroke-width="2"/>
<text x="829" y="397" font-size="29" font-weight="bold" text-anchor="start">Fixed expert</text>
<text x="829" y="439" font-size="26" font-weight="normal" text-anchor="start">all ten roles</text>
</g>
<polyline id="window-to-time" points="295,445 345,445 345,405 395,405" fill="none" stroke="#28313b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline id="time-to-expert" points="720,405 795,405" fill="none" stroke="#28313b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline id="window-to-welch" points="195,520 195,577 365,577" fill="none" stroke="#28313b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline id="welch-to-band" points="625,577 705,577" fill="none" stroke="#28313b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline id="band-to-expert" points="920,535 920,465" fill="none" stroke="#28313b" stroke-width="3" marker-end="url(#arrow)"/>
<g id="ambiguity">
<rect x="1175" y="270" width="570" height="385" rx="10" fill="#f6f7f8" stroke="#66737e" stroke-width="2"/>
<text x="1199" y="312" font-size="29" font-weight="bold" text-anchor="start">b  Unresolved readiness</text>
<text x="1199" y="354" font-size="26" font-weight="normal" text-anchor="start">Repeated feature ≠ distinct input roles</text>
<text x="1199" y="390" font-size="26" font-weight="normal" text-anchor="start">Other-window feature ≠ current input</text>
<text x="1199" y="426" font-size="26" font-weight="normal" text-anchor="start">Prediction exists ≠ submission supported</text>
<text x="1199" y="462" font-size="26" font-weight="normal" text-anchor="start">Native validation already rejects</text>
<text x="1199" y="498" font-size="26" font-weight="normal" text-anchor="start">incompatible numerical inputs</text>
<text x="1199" y="534" font-size="26" font-weight="normal" text-anchor="start">What is the value of earlier feedback?</text>
</g>
<polyline id="contract-to-ambiguity" points="1095,465 1165,465" fill="none" stroke="#28313b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="55" y="710" font-size="29" font-weight="bold" text-anchor="start">Controlled intervention Z = (o, e): outer organization × active evidence feedback</text>
<g id="reactive-control">
<rect x="55" y="745" width="795" height="150" rx="10" fill="#f6f7f8" stroke="#66737e" stroke-width="2"/>
<text x="79" y="787" font-size="29" font-weight="bold" text-anchor="start">c  Evidence feedback off</text>
<text x="79" y="829" font-size="26" font-weight="normal" text-anchor="start">Shared catalog + public history → request</text>
<text x="79" y="865" font-size="26" font-weight="normal" text-anchor="start">Native execution / rejection → next decision</text>
</g>
<g id="active-feedback">
<rect x="950" y="745" width="795" height="150" rx="10" fill="#edf3f7" stroke="#66737e" stroke-width="4"/>
<text x="974" y="787" font-size="29" font-weight="bold" text-anchor="start">d  Evidence feedback on</text>
<text x="974" y="829" font-size="26" font-weight="normal" text-anchor="start">Same history → deterministic ηₜ → phase sₜ / menu Γₜ</text>
<text x="974" y="865" font-size="26" font-weight="normal" text-anchor="start">Same native execution and validation</text>
</g>
<polyline id="ambiguity-to-intervention" points="1470,655 1470,735" fill="none" stroke="#28313b" stroke-width="3" marker-end="url(#arrow)"/>
<g id="measurement">
<rect x="55" y="985" width="1690" height="115" rx="10" fill="#f6f7f8" stroke="#66737e" stroke-width="2"/>
<text x="79" y="1027" font-size="29" font-weight="bold" text-anchor="start">Observed consequence — not an assumed improvement</text>
<text x="79" y="1069" font-size="26" font-weight="normal" text-anchor="start">τₖ → Tₖ: supported delivery, repeated calls, tokens, latency;   evaluator-only cₖ → Yₖ and M(D)</text>
</g>
<polyline id="control-to-outcomes" points="450,895 450,975" fill="none" stroke="#28313b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline id="feedback-to-outcomes" points="1350,895 1350,975" fill="none" stroke="#28313b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="55" y="1130" font-size="25" font-weight="normal" text-anchor="start">Graph and readiness computation are common; only exposure and use of feedback change with e.</text>
</g></svg>
