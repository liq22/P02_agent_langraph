<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="177mm" viewBox="0 0 1800 1770">
<title>PHMGraph coupled decision and diagnostic evidence graphs</title>
<desc>Conceptual scientific diagram. No empirical values. Labels are editable text.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#28313b"/></marker></defs>
<rect width="1800" height="1770" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#202830">
<text x="55" y="60" font-size="33" font-weight="bold" text-anchor="start">PHMGraph: decisions act on evidence; evidence constrains decisions</text>
<text x="55" y="102" font-size="25" font-weight="normal" text-anchor="start">Grey: common evidence / numerics    Dashed: inherited control    Blue: active feedback</text>
<g id="outer-graph">
<rect x="55" y="150" width="1040" height="310" rx="10" fill="#f6f7f8" stroke="#66737e" stroke-width="2" stroke-dasharray="9 6"/>
<text x="79" y="192" font-size="29" font-weight="bold" text-anchor="start">2 / 4  Outer state sₜ in Gᵒᵘᵗ</text>
</g>
<g id="phase-inspect">
<rect x="95" y="230" width="220" height="85" rx="10" fill="#f6f7f8" stroke="#66737e" stroke-width="2"/>
<text x="119" y="272" font-size="29" font-weight="bold" text-anchor="start">Inspect</text>
</g>
<g id="phase-analyze">
<rect x="395" y="230" width="235" height="85" rx="10" fill="#f6f7f8" stroke="#66737e" stroke-width="2"/>
<text x="419" y="272" font-size="29" font-weight="bold" text-anchor="start">Analyze</text>
</g>
<g id="phase-check">
<rect x="735" y="230" width="275" height="85" rx="10" fill="#f6f7f8" stroke="#66737e" stroke-width="2"/>
<text x="759" y="272" font-size="29" font-weight="bold" text-anchor="start">Check</text>
</g>
<polyline id="read-to-analyze" points="315,272 385,272" fill="none" stroke="#28313b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline id="ready-to-check" points="630,272 725,272" fill="none" stroke="#28313b" stroke-width="3" marker-end="url(#arrow)"/>
<g id="phase-recover">
<rect x="395" y="355" width="235" height="80" rx="10" fill="#f6f7f8" stroke="#66737e" stroke-width="2"/>
<text x="419" y="397" font-size="29" font-weight="bold" text-anchor="start">Recover</text>
</g>
<polyline id="error-to-recovery" points="875,315 875,395 640,395" fill="none" stroke="#28313b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="700" y="376" font-size="23" font-weight="normal" text-anchor="start">error</text>
<polyline id="recovery-to-inspect" points="395,397 205,397 205,325" fill="none" stroke="#28313b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline id="check-continuation" points="960,230 960,205 765,205 765,220" fill="none" stroke="#28313b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="700" y="193" font-size="23" font-weight="normal" text-anchor="start">Optional continuation</text>
<g id="decision-interface">
<rect x="1195" y="150" width="550" height="310" rx="10" fill="#f6f7f8" stroke="#66737e" stroke-width="2"/>
<text x="1219" y="192" font-size="29" font-weight="bold" text-anchor="start">4–6  Shared decision / execution</text>
<text x="1219" y="234" font-size="26" font-weight="normal" text-anchor="start">Full catalog B + public history hₜ</text>
<text x="1219" y="270" font-size="26" font-weight="normal" text-anchor="start">Pointer and admissible menu Γₜ</text>
<text x="1219" y="306" font-size="26" font-weight="normal" text-anchor="start">Fixed LLM proposes one request aₜ</text>
<text x="1219" y="342" font-size="26" font-weight="normal" text-anchor="start">Native tools validate and execute</text>
<text x="1219" y="378" font-size="26" font-weight="normal" text-anchor="start">Structural readiness ≠ full validation</text>
</g>
<polyline id="phase-to-interface" points="1095,290 1185,290" fill="none" stroke="#28313b" stroke-width="3" marker-end="url(#arrow)"/>
<g id="evidence-feedback">
<rect x="345" y="535" width="1400" height="145" rx="10" fill="#edf3f7" stroke="#66737e" stroke-width="4"/>
<text x="369" y="577" font-size="29" font-weight="bold" text-anchor="start">3 / 4  Evidence ηₜ = Φ(Gᶦⁿₜ); public predicates Wₜ and Eₜ</text>
<text x="369" y="619" font-size="26" font-weight="normal" text-anchor="start">Role coverage r(m,w,t), Rₜ · supported predictions Pₜ · window Wₜ · latest error Eₜ</text>
<text x="369" y="655" font-size="26" font-weight="normal" text-anchor="start">Missing prerequisites delay prediction / submission; eligible submission need not close analysis</text>
</g>
<polyline id="evidence-to-phase" points="510,535 510,470" fill="none" stroke="#28313b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="545" y="505" font-size="25" font-weight="normal" text-anchor="start">Conditions state sₜ and menu Γₜ</text>
<polyline id="evidence-to-menu" points="1550,535 1550,470" fill="none" stroke="#28313b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline id="execution-to-update" points="1745,370 1775,370 1775,720 1685,720 1685,760" fill="none" stroke="#28313b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1195" y="745" font-size="25" font-weight="normal" text-anchor="start">6  Observed result oₜ₊₁ → append</text>
<g id="inner-graph">
<rect x="55" y="770" width="1690" height="450" rx="10" fill="#f6f7f8" stroke="#66737e" stroke-width="2"/>
<text x="79" y="812" font-size="29" font-weight="bold" text-anchor="start">1 / 3 / 6  Inner evidence DAG Gᶦⁿₜ: entities and executed activities</text>
</g>
<g id="raw-window">
<rect x="95" y="955" width="195" height="105" rx="10" fill="#f6f7f8" stroke="#66737e" stroke-width="2"/>
<text x="119" y="997" font-size="29" font-weight="bold" text-anchor="start">Window</text>
<text x="119" y="1039" font-size="26" font-weight="normal" text-anchor="start">same scope</text>
</g>
<g id="time-call">
<rect x="355" y="860" width="230" height="85" rx="10" fill="#f6f7f8" stroke="#66737e" stroke-width="2"/>
<text x="379" y="902" font-size="29" font-weight="bold" text-anchor="start">Time calls</text>
</g>
<g id="time-features">
<rect x="665" y="860" width="240" height="85" rx="10" fill="#f6f7f8" stroke="#66737e" stroke-width="2"/>
<text x="689" y="902" font-size="29" font-weight="bold" text-anchor="start">6 features</text>
</g>
<g id="psd-call">
<rect x="355" y="1070" width="200" height="85" rx="10" fill="#f6f7f8" stroke="#66737e" stroke-width="2"/>
<text x="379" y="1112" font-size="29" font-weight="bold" text-anchor="start">Welch call</text>
</g>
<g id="psd-entity">
<rect x="615" y="1070" width="180" height="85" rx="10" fill="#f6f7f8" stroke="#66737e" stroke-width="2"/>
<text x="639" y="1112" font-size="29" font-weight="bold" text-anchor="start">PSD</text>
</g>
<g id="band-call">
<rect x="855" y="1070" width="230" height="85" rx="10" fill="#f6f7f8" stroke="#66737e" stroke-width="2"/>
<text x="879" y="1112" font-size="29" font-weight="bold" text-anchor="start">Band calls</text>
</g>
<g id="band-features">
<rect x="1145" y="1070" width="235" height="85" rx="10" fill="#f6f7f8" stroke="#66737e" stroke-width="2"/>
<text x="1169" y="1112" font-size="29" font-weight="bold" text-anchor="start">4 features</text>
</g>
<g id="model-call">
<rect x="1145" y="920" width="235" height="100" rx="10" fill="#f6f7f8" stroke="#66737e" stroke-width="2"/>
<text x="1169" y="962" font-size="29" font-weight="bold" text-anchor="start">Model call</text>
<text x="1169" y="1004" font-size="26" font-weight="normal" text-anchor="start">fixed expert</text>
</g>
<g id="prediction">
<rect x="1460" y="920" width="245" height="100" rx="10" fill="#f6f7f8" stroke="#66737e" stroke-width="2"/>
<text x="1484" y="962" font-size="29" font-weight="bold" text-anchor="start">Prediction</text>
<text x="1484" y="1004" font-size="26" font-weight="normal" text-anchor="start">class + values</text>
</g>
<polyline id="window-time-use" points="290,985 320,985 320,902 345,902" fill="none" stroke="#28313b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline id="time-generation" points="585,902 655,902" fill="none" stroke="#28313b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline id="time-model-roles" points="905,902 1260,902 1260,910" fill="none" stroke="#28313b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline id="window-psd-use" points="290,1020 320,1020 320,1112 345,1112" fill="none" stroke="#28313b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline id="psd-generation" points="555,1112 605,1112" fill="none" stroke="#28313b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline id="psd-band-use" points="795,1112 845,1112" fill="none" stroke="#28313b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline id="band-generation" points="1085,1112 1135,1112" fill="none" stroke="#28313b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline id="band-model-roles" points="1260,1070 1260,1030" fill="none" stroke="#28313b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline id="prediction-generation" points="1380,970 1450,970" fill="none" stroke="#28313b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="95" y="1190" font-size="24" font-weight="normal" text-anchor="start">Arrows bind actual input roles and generated artifacts; feature groups are compressed for display.</text>
<polyline id="inner-to-frontier" points="825,770 825,690" fill="none" stroke="#28313b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="355" y="745" font-size="25" font-weight="normal" text-anchor="start">3  Compute Φ in every condition</text>
<g id="explanation-output">
<rect x="55" y="1300" width="1690" height="145" rx="10" fill="#f6f7f8" stroke="#66737e" stroke-width="2"/>
<text x="79" y="1342" font-size="29" font-weight="bold" text-anchor="start">7  Output: outer control path + selected numerical support subgraph</text>
<text x="79" y="1384" font-size="26" font-weight="normal" text-anchor="start">Native submission agreement and feature support · offline replay with the same data and fitted models</text>
<text x="79" y="1420" font-size="26" font-weight="normal" text-anchor="start">Evaluate label delivery, computational support and replay agreement separately; true labels stay evaluator-only</text>
</g>
<polyline id="prediction-to-selected-support" points="1580,1020 1580,1290" fill="none" stroke="#28313b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="95" y="1270" font-size="25" font-weight="bold" text-anchor="start">No feedback edge from private labels or offline replay to the Agent</text>
<text x="55" y="1480" font-size="24" font-weight="normal" text-anchor="start">Coupled path shown; o and e switch outer organization and active feedback, not numerical capability.</text>
<text x="55" y="1532" font-size="28" font-weight="bold" text-anchor="start">Continuation comparison at o = 1 — independent episodes, not execution stages</text>
<g id="control-10">
<rect x="55" y="1555" width="525" height="110" rx="10" fill="#f6f7f8" stroke="#66737e" stroke-width="2"/>
<text x="79" y="1597" font-size="29" font-weight="bold" text-anchor="start">10  Outer only</text>
<text x="79" y="1639" font-size="26" font-weight="normal" text-anchor="start">Ordinary prediction closes analysis</text>
</g>
<g id="control-open10">
<rect x="637" y="1555" width="525" height="110" rx="10" fill="#f6f7f8" stroke="#66737e" stroke-width="2"/>
<text x="661" y="1597" font-size="29" font-weight="bold" text-anchor="start">10⁺  Open outer control</text>
<text x="661" y="1639" font-size="26" font-weight="normal" text-anchor="start">Native success Nₜ opens continuation</text>
</g>
<g id="control-11">
<rect x="1219" y="1555" width="525" height="110" rx="10" fill="#edf3f7" stroke="#66737e" stroke-width="4"/>
<text x="1243" y="1597" font-size="29" font-weight="bold" text-anchor="start">11  Full feedback</text>
<text x="1243" y="1639" font-size="26" font-weight="normal" text-anchor="start">Readiness controls admission</text>
</g>
<text x="55" y="1710" font-size="27" font-weight="bold" text-anchor="start">Opening: M(10⁺) − M(10)          Remaining feedback: M(11) − M(10⁺)</text>
<text x="55" y="1750" font-size="24" font-weight="normal" text-anchor="start">Menu equality is local: the same ready, supported post-prediction prefix. No global match is assumed.</text>
</g></svg>
