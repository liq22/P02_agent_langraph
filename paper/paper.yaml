schema_version: 1
paper_id: paper2
paper_role: downstream_graph_study
title: "Graph-Guided PHM Agents for Long-Horizon Diagnostic Rollouts"
short_title: Graph-Guided PHM Agent
language: English
stage: development
active_source: paper/draft/main.md

research_question: >-
  Does an explicit PHM decision-state graph improve task performance and
  long-horizon branch choice, recovery, repetition, budget use, and completion when the same agent has the
  same Benchmark Generic LLM base and computational capabilities?

primary_hypothesis: >-
  Under a matched Generic LLM base prompt, model, runtime, data, tasks, tools,
  numerical experts, action budget, and evaluator, GraphDecisionAgent improves
  target-adverse Average Precision on replay monitoring relative to the Benchmark Generic
  control (implemented by the zero-override ReactiveSequentialAgent wrapper).

